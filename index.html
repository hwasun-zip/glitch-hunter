// ===== src/audio.js =====
// 효과음: 소리 파일 없이 브라우저에서 직접 합성합니다.
window.GH = window.GH || {};

GH.Sfx = {
  ctx: null,
  muted: false,

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },

  toggleMute() { this.muted = !this.muted; return this.muted; },

  ok() {
    if (!this.ctx || this.muted) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },

  tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, filterType, freq, vol = 0.3, delay = 0) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = filterType; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  },

  swing()    { this.noise(0.07, 'highpass', 3000, 0.12); },
  hit()      { this.noise(0.09, 'bandpass', 1600, 0.45); this.tone(200, 60, 0.09, 'square', 0.22); },
  finisher() { this.noise(0.18, 'lowpass', 1400, 0.6); this.tone(260, 40, 0.18, 'sawtooth', 0.3); },
  kill()     { this.tone(880, 1760, 0.06, 'square', 0.12); this.tone(660, 1320, 0.06, 'square', 0.12, 0.06); this.tone(440, 110, 0.25, 'sawtooth', 0.15, 0.12); this.noise(0.3, 'lowpass', 900, 0.4, 0.05); },
  jump()     { this.tone(320, 640, 0.09, 'square', 0.07); },
  land()     { this.noise(0.05, 'lowpass', 500, 0.15); },
  dash()     { this.noise(0.16, 'highpass', 1800, 0.25); },
  hurt()     { this.tone(500, 90, 0.22, 'sawtooth', 0.25); this.noise(0.12, 'bandpass', 800, 0.3); },
  warn()     { this.tone(600, 900, 0.12, 'triangle', 0.12); this.tone(600, 900, 0.12, 'triangle', 0.12, 0.15); },
  shoot()    { this.tone(1200, 400, 0.12, 'square', 0.1); },
  parry()    { this.tone(1500, 2400, 0.08, 'triangle', 0.18); },
  pew()      { this.tone(1400, 700, 0.07, 'square', 0.09); },
  block()    { this.tone(180, 120, 0.1, 'square', 0.22); this.noise(0.08, 'bandpass', 2500, 0.3); },
  guardBreak() { this.tone(300, 60, 0.35, 'sawtooth', 0.3); this.noise(0.3, 'lowpass', 1200, 0.5); },
  bossWarn() { this.tone(220, 220, 0.25, 'sawtooth', 0.18); this.tone(220, 220, 0.25, 'sawtooth', 0.18, 0.3); },
  slam()     { this.noise(0.4, 'lowpass', 400, 0.8); this.tone(120, 30, 0.4, 'sine', 0.5); },
  overload() { this.tone(80, 600, 1.2, 'sawtooth', 0.15); },
  blast()    { this.noise(0.8, 'lowpass', 900, 0.9); this.tone(200, 20, 0.8, 'sawtooth', 0.4); },
  groggy()   { [880, 660, 440, 220].forEach((f, i) => this.tone(f, f * 0.9, 0.15, 'square', 0.15, i * 0.08)); },
  laserWarn() { this.tone(900, 1100, 0.08, 'square', 0.06); },
  laser()     { this.tone(180, 160, 0.5, 'sawtooth', 0.12); this.noise(0.3, 'bandpass', 3000, 0.12); },
  blockCrash() { this.noise(0.2, 'lowpass', 700, 0.5); this.tone(140, 50, 0.2, 'square', 0.2); },
  clank()     { this.tone(1800, 1200, 0.08, 'square', 0.18); this.tone(900, 700, 0.12, 'triangle', 0.15); },
  rank()      { [523, 784, 1047, 1568].forEach((f, i) => this.tone(f, f, 0.22, 'triangle', 0.15, i * 0.12)); },
  clear()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.18, 'square', 0.12, i * 0.1)); },
};


// ===== src/analytics.js =====
// =====================================================
// 3층: 플레이 로그 + 적응형 난이도 + A/B 배정
// - 개인정보 없이 무작위 익명 ID만 사용
// - 그룹: control(보정 끔) / adaptive(보정 켬). 두 그룹의 화면과 문구는 동일하고 수치만 다름
// =====================================================
window.GH = window.GH || {};

GH.Run = {
  init() {
    if (this.ready) return;
    this.ready = true;
    const params = new URLSearchParams(location.search);
    this.debug = params.get('debug') === '1';

    // 플레이어 ID와 그룹은 브라우저에 저장: 같은 사람이 두 그룹에 섞이지 않도록
    this.playerId = this.store('gh_player') || this.store('gh_player', this.rid());
    let group = params.get('group');
    if (group !== 'control' && group !== 'adaptive') {
      group = this.store('gh_group') || (Math.random() < 0.5 ? 'control' : 'adaptive');
    }
    this.group = this.store('gh_group', group);

    this.sessionId = this.rid();            // 페이지를 열 때마다 새 세션
    this.version = GH.CONFIG.version;
    this.attempts = { S1: 0, S2: 0, BOSS: 0 };
    this.deaths = { S1: 0, S2: 0, BOSS: 0 };
    this.skills = {};                        // 섹터별 실력 점수 (-1 ~ 1)
    this.skill = null;                       // 지금까지의 실력 점수 (클리어한 섹터들의 평균)
    this.run = null;                         // 섹터 1부터 보스까지 한 판의 누적 기록
    this.current = null;
    this.local = this.loadLocal();

    this.log('session_start', { ua: navigator.userAgent.slice(0, 120) });

    // 창을 닫으면 진행 중인 시도를 "이탈"로 기록
    window.addEventListener('pagehide', () => { if (this.current) this.endAttempt('quit', {}, true); });
    // 다른 탭으로 잠깐 가는 것은 이탈이 아님: 시도는 계속 열어 두고 "숨김" 이벤트만 남김
    // (모바일처럼 pagehide 없이 꺼지는 경우, 마지막 기록이 hidden이면 분석 때 이탈로 판단)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && this.current) {
        const c = this.current;
        this.log('hidden', { sector: c.sector, attempt: c.attempt, duration_s: Math.round((Date.now() - c.t0) / 100) / 10 }, true);
      }
    });
  },

  rid() { return Math.random().toString(36).slice(2, 10); },

  store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { /* 저장소를 못 쓰는 환경 */ }
    return value;
  },

  loadLocal() {
    try { return JSON.parse(localStorage.getItem('gh_logs') || '[]'); } catch (e) { return []; }
  },

  // ===== 시도 단위 기록 =====
  startAttempt(sector) {
    if (sector === 'S1' && !this.run) this.run = { t0: Date.now(), damage: 0, deaths: 0 };
    this.attempts[sector] += 1;
    this.current = {
      sector, attempt: this.attempts[sector], t0: Date.now(),
      hits: 0, damage: 0, patternHits: {}, overload: [], difficulty: this.difficultyFor(sector),
    };
    this.log('attempt_start', { sector, attempt: this.current.attempt, difficulty: this.current.difficulty });
    return this.current.difficulty;
  },

  hit(amount, source) {
    const c = this.current;
    if (!c) return;
    c.hits += 1;
    c.damage += amount;
    if (this.run) this.run.damage += amount;
    c.patternHits[source] = (c.patternHits[source] || 0) + 1;
    c.lastSource = source;
  },

  // 무력화 결과: 성공은 "O", 실패는 "X" + 남은 게이지 % (예: X42 = 42% 남기고 실패)
  overloadResult(success, leftRatio = 0) {
    if (this.current) this.current.overload.push(success ? 'O' : 'X' + Math.round(leftRatio * 100));
  },

  endAttempt(result, extra = {}, beacon = false) {
    const c = this.current;
    if (!c) return;
    this.current = null;
    const duration = Math.round((Date.now() - c.t0) / 100) / 10;
    if (result === 'death') { this.deaths[c.sector] += 1; if (this.run) this.run.deaths += 1; }
    const row = {
      sector: c.sector, attempt: c.attempt, result, duration_s: duration,
      hits_taken: c.hits, damage_taken: c.damage, cause: result === 'death' ? c.lastSource : '',
      overload: c.overload.join(','), pattern_hits: c.patternHits, difficulty: c.difficulty,
      ...extra,
    };
    if ((c.sector === 'S1' || c.sector === 'S2') && result === 'clear') {
      this.skills[c.sector] = GH.Adaptive.skillScore(c.sector, c.hits, duration, this.deaths[c.sector]);
      const vals = Object.values(this.skills);
      this.skill = Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 100) / 100;
      row.skill_score = this.skills[c.sector];
    }
    this.log('attempt_end', row, beacon);
  },

  difficultyFor(sector) {
    const index = { S1: 0, S2: 1, BOSS: 2 }[sector];
    if (index === 0) return 1;
    return GH.Adaptive.difficulty(this.group, index, this.skill, this.deaths[sector]);
  },

  // 보스 처치: 한 판 요약 기록 후 초기화
  completeRun(overload) {
    const r = this.run || { t0: Date.now(), damage: 0, deaths: 0 };
    const total = Math.round((Date.now() - r.t0) / 1000);
    const rank = GH.Adaptive.rank(r.deaths, r.damage);
    const summary = { total_s: total, deaths: r.deaths, damage: r.damage, rank, overload };
    // 시트의 기존 열에 맞추기 위해 랭크와 쓰러진 횟수는 상세(JSON) 열에 함께 기록
    this.log('run_complete', { sector: 'RUN', result: 'clear', duration_s: total, damage_taken: r.damage, overload, skill_score: this.skill, pattern_hits: { rank, run_deaths: r.deaths } });
    this.run = null;
    this.skills = {};
    this.skill = null;
    this.deaths = { S1: 0, S2: 0, BOSS: 0 };
    return summary;
  },

  // ===== 전송 =====
  log(event, data = {}, beacon = false) {
    const rec = {
      time: new Date().toISOString(), player: this.playerId, session: this.sessionId,
      group: this.group, version: this.version, debug: this.debug ? 1 : 0, event, ...data,
    };
    this.local.push(rec);
    try { localStorage.setItem('gh_logs', JSON.stringify(this.local.slice(-500))); } catch (e) { /* 무시 */ }
    if (this.debug) console.log('[GH log]', rec);

    const url = GH.CONFIG.log.endpoint;
    if (!url) return;
    const body = JSON.stringify(rec);
    try {
      if (beacon && navigator.sendBeacon) navigator.sendBeacon(url, body);
      else fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body }).catch(() => {});  // 오프라인이어도 게임엔 영향 없음
    } catch (e) { /* 네트워크 실패는 게임에 영향 없음 */ }
  },

  downloadLogs() {
    const blob = new Blob([JSON.stringify(this.local, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `glitch-hunter-logs-${this.playerId}.json`;
    a.click();
  },
};

// ===== 적응형 난이도 =====
GH.Adaptive = {
  // 실력 점수: 섹터 1을 적게 맞고 빨리 깰수록 +, 많이 맞고 오래 걸리거나 죽었으면 -
  skillScore(sector, hits, durationSec, deaths) {
    const a = { ...GH.CONFIG.adaptive, ...GH.CONFIG.adaptive.targets[sector] };
    const effHits = hits + deaths * a.hitsPerDeath;
    const hitPart = (a.targetHits - effHits) / a.targetHits;
    const timePart = (a.targetTime - durationSec) / a.targetTime;
    const s = hitPart * a.hitWeight + timePart * a.timeWeight;
    return Math.round(Phaser.Math.Clamp(s, -1, 1) * 100) / 100;
  },

  // 섹터 난이도 배율 (index: 섹터 2 = 1, 보스 = 2)
  // control: 기본 상승만 (섹터 2 x1.08, 보스 x1.16 고정)
  // adaptive: 기본 상승 x 실력 보정(±20%) x 그 섹터에서 죽을 때마다 완화(-5%)
  difficulty(group, index, skill, sectorDeaths) {
    const a = GH.CONFIG.adaptive;
    const base = 1 + a.risePerSector * index;
    const bossDeaths = sectorDeaths;
    if (group !== 'adaptive') return base;
    const s = skill === null ? 0 : skill;
    let d = base * (1 + s * a.range) * (1 - bossDeaths * a.deathEase);
    d = Phaser.Math.Clamp(d, base * (1 - a.range) * 0.9, base * (1 + a.range));
    return Math.round(d * 100) / 100;
  },

  // 엔딩 랭크: 한 판 동안의 사망 횟수와 받은 피해 기준
  rank(deaths, damage) {
    const r = GH.CONFIG.rank;
    if (deaths === 0 && damage <= r.S) return 'S';
    if (deaths <= 1 && damage <= r.A) return 'A';
    if (deaths <= 3) return 'B';
    return 'C';
  },
};


// ===== src/player.js =====
// 플레이어: 꼬마 로봇 "헌터"
window.GH = window.GH || {};

GH.Player = class Player {
  constructor(scene, x, y) {
    this.scene = scene;
    this.cfg = GH.CONFIG.player;

    this.sprite = scene.physics.add.sprite(x, y, 'robot');
    this.sprite.setCollideWorldBounds(true);
    this.sprite.body.setSize(30, 46).setOffset(7, 6);
    this.sprite.setVisible(false);  // 물리 판정용 (보이지 않음)
    // 보이는 그림은 따로: 찌그러짐 연출이 물리 판정 크기를 바꾸지 않도록 분리
    this.view = scene.add.image(x, y, 'robot').setDepth(10);
    this.shieldView = scene.add.image(x, y, 'shield').setDepth(11).setVisible(false);
    scene.events.on('postupdate', this.sync, this);
    scene.events.once('shutdown', () => scene.events.off('postupdate', this.sync, this));

    this.hp = this.cfg.maxHp;
    this.facing = 1;              // 1 = 오른쪽, -1 = 왼쪽
    this.state = 'normal';        // normal | attack | dash | guard | hurt | dead
    this.comboIndex = -1;
    this.comboQueued = false;
    this.lastAttackEnd = 0;
    this.dashReadyAt = 0;
    this.invincibleUntil = 0;
    this.lastGroundTime = 0;
    this.jumpPressedAt = -9999;
    this.hitbox = null;           // 현재 공격 판정 { rect, damage, knockback, finisher, hitTargets }
    this.ammo = this.cfg.shot.maxAmmo;
    this.nextShotAt = 0;
    this.nextReloadAt = 0;
    this.guardGauge = this.cfg.guard.max;
    this.guardRegenAt = 0;
    this.guardLockedUntil = 0;
    this.lastTime = 0;

    const K = Phaser.Input.Keyboard.KeyCodes;
    this.keys = scene.input.keyboard.addKeys({
      left: K.LEFT, right: K.RIGHT, up: K.UP, down: K.DOWN, space: K.SPACE, attack: K.Z, dash: K.X, shoot: K.C,
    });
  }

  sync() {
    this.view.setPosition(this.sprite.x, this.sprite.y);
    this.shieldView.setPosition(this.sprite.x + this.facing * 24, this.sprite.y).setFlipX(this.facing < 0);
  }

  get onGround() {
    return this.sprite.body.blocked.down || this.sprite.body.touching.down;
  }

  isInvincible(time) {
    return this.state === 'dash' || this.state === 'dead' || time < this.invincibleUntil;
  }

  update(time) {
    const s = this.sprite;
    const k = this.keys;
    if (this.state === 'dead') { this.shieldView.setVisible(false); return; }
    const dt = Math.min(100, time - (this.lastTime || time)) / 1000;
    this.lastTime = time;

    // ---- 탄 재충전 / 방패 게이지 회복 ----
    const sc = this.cfg.shot;
    if (this.ammo < sc.maxAmmo && time >= this.nextReloadAt) {
      this.ammo += 1;
      this.nextReloadAt = time + sc.reload;
    }
    const gc = this.cfg.guard;
    if (this.state !== 'guard' && time >= this.guardRegenAt && time >= this.guardLockedUntil) {
      this.guardGauge = Math.min(gc.max, this.guardGauge + gc.regen * dt);
    }

    const grounded = this.onGround;
    if (grounded) { this.lastGroundTime = time; this.liftUsed = false; }
    if (grounded && !this.wasOnGround) { this.squash(1.25, 0.75); GH.Sfx.land(); }
    this.wasOnGround = grounded;

    // 피격 무적 중 깜빡임
    this.view.setAlpha(this.state !== 'dash' && time < (this.blinkUntil || 0) ? (Math.floor(time / 60) % 2 ? 0.35 : 1) : (this.state === 'dash' ? 0.6 : 1));

    if (this.state === 'hurt') return;

    // ---- 대시 (방패 중에도 가능) ----
    if (Phaser.Input.Keyboard.JustDown(k.dash) && time >= this.dashReadyAt && this.state !== 'dash') {
      this.endGuard();
      this.startDash(time);
    }

    // ---- 방패: ↓를 누르고 있는 동안 ----
    if (this.state === 'normal' && k.down.isDown && time >= this.guardLockedUntil && this.guardGauge > 0) {
      this.state = 'guard';
      this.shieldView.setVisible(true).setAlpha(1).setScale(1.3);
      this.scene.tweens.add({ targets: this.shieldView, scale: 1, duration: 120, ease: 'Back.Out' });
    }
    if (this.state === 'guard') {
      if (!k.down.isDown) { this.endGuard(); }
      else {
        if (k.left.isDown) this.setFacing(-1);
        if (k.right.isDown) this.setFacing(1);
        s.setVelocityX(0);
        return;
      }
    }

    // ---- 사격 ----
    if (Phaser.Input.Keyboard.JustDown(k.shoot) && this.state === 'normal' && this.ammo > 0 && time >= this.nextShotAt) {
      this.ammo -= 1;
      this.nextShotAt = time + sc.cooldown;
      if (this.nextReloadAt < time) this.nextReloadAt = time + sc.reload;
      this.scene.spawnPlayerBullet(s.x + this.facing * 26, s.y - 2, this.facing * sc.speed, 0, sc.damage, false);
      this.view.x -= this.facing * 3;   // 반동
      GH.Sfx.pew();
    }

    // ---- 공격 ----
    if (Phaser.Input.Keyboard.JustDown(k.attack)) {
      if (this.state === 'attack') {
        this.comboQueued = true;
      } else if (this.state === 'normal') {
        const cont = time - this.lastAttackEnd <= this.cfg.comboWindow && this.comboIndex >= 0 && this.comboIndex < 2;
        this.startAttack(cont ? this.comboIndex + 1 : 0);
      }
    }

    if (this.state === 'dash') return;

    // ---- 이동 ----
    let dir = 0;
    if (k.left.isDown) dir -= 1;
    if (k.right.isDown) dir += 1;
    if (this.state === 'normal') {
      s.setVelocityX(dir * this.cfg.moveSpeed);
      if (dir !== 0) this.setFacing(dir);
    }

    // ---- 점프: 착지 직전 입력 기억 + 발판 끝 여유 + 길게/짧게 ----
    const jumpDown = Phaser.Input.Keyboard.JustDown(k.up) || Phaser.Input.Keyboard.JustDown(k.space);
    if (jumpDown) this.jumpPressedAt = time;
    const canJump = time - this.lastGroundTime <= this.cfg.coyoteTime;
    if (this.state === 'normal' && time - this.jumpPressedAt <= this.cfg.jumpBuffer && canJump) {
      s.setVelocityY(-this.cfg.jumpPower);
      this.jumpPressedAt = -9999;
      this.lastGroundTime = -9999;
      this.squash(0.75, 1.25);
      GH.Sfx.jump();
    }
    const jumpHeld = k.up.isDown || k.space.isDown;
    if (!jumpHeld && s.body.velocity.y < -200) {
      s.setVelocityY(s.body.velocity.y * this.cfg.jumpCut);
    }

    // 공격 판정을 플레이어에 붙여서 따라오게
    if (this.hitbox) {
      const r = this.hitbox.rect;
      if (this.hitbox.up) {
        // 올려베기: 앞쪽 위
        r.x = s.x + this.facing * (r.width / 2) - r.width / 2;
        r.y = s.y - r.height - 10;
      } else {
        r.x = s.x + this.facing * (r.width / 2 + 8) - r.width / 2;
        r.y = s.y - r.height / 2;
      }
      if (this.slashFx) this.slashFx.setPosition(s.x + this.facing * 34, s.y);
    }
  }

  endGuard() {
    if (this.state === 'guard') this.state = 'normal';
    this.shieldView.setVisible(false);
  }

  setFacing(dir) {
    this.facing = dir;
    this.view.setFlipX(dir < 0);
  }

  squash(sx, sy) {
    this.scene.tweens.killTweensOf(this.view);
    this.view.setScale(sx, sy);
    this.scene.tweens.add({ targets: this.view, scaleX: 1, scaleY: 1, duration: 160, ease: 'Back.Out' });
  }

  startAttack(index) {
    const atk = this.cfg.combo[index];
    this.state = 'attack';
    this.comboIndex = index;
    this.comboQueued = false;
    const id = this.attackId = (this.attackId || 0) + 1;

    // 공격 방향: 누르고 있는 방향키 우선
    if (this.keys.left.isDown) this.setFacing(-1);
    if (this.keys.right.isDown) this.setFacing(1);

    const up = this.keys.up.isDown;          // ↑를 누르고 있으면 올려베기
    const inAir = !this.onGround;

    this.hitbox = {
      rect: new Phaser.Geom.Rectangle(0, 0, atk.range, up ? atk.range : atk.height),
      damage: atk.damage, knockback: atk.knockback, finisher: index === 2, hitTargets: new Set(), up,
    };

    // 앞으로(또는 대각선 위로) 날아가는 에너지 파동 (근접 판정과 같은 대상은 한 번만 맞음)
    const ang = up ? this.cfg.upSlash.angle : 0;
    this.scene.spawnWave(this.sprite.x + this.facing * 24, this.sprite.y - (up ? 20 : 0), this.facing, atk, index === 2, this.hitbox.hitTargets, ang);

    if (up && !this.liftUsed) {
      // 첫 올려베기는 몸이 살짝 떠오름 (점프당 1회)
      this.liftUsed = true;
      this.sprite.setVelocityY(Math.min(this.sprite.body.velocity.y, -this.cfg.upSlash.lift));
    } else if (inAir && this.sprite.body.velocity.y > 0) {
      // 공중 공격 중에는 잠깐 체공
      this.sprite.setVelocityY(0);
    }

    // 앞으로 내딛기 (공중에서는 약하게)
    this.sprite.setVelocityX(this.facing * atk.lunge * (inAir ? 0.4 : 1));
    this.scene.time.delayedCall(90, () => { if (this.attackId === id) this.sprite.setVelocityX(0); });

    // 베기 이펙트
    if (this.slashFx) this.slashFx.destroy();
    const fx = this.scene.add.image(this.sprite.x + this.facing * 34, this.sprite.y, 'slash').setDepth(11);
    fx.setFlipX(this.facing < 0);
    fx.setScale(index === 2 ? 2.0 : 1.4, index === 2 ? 1.6 : 1.2);
    if (index === 1) fx.setFlipY(true);
    if (index === 2) fx.setTint(GH.COLORS.neonPink);
    fx.setAngle(this.facing * (index === 1 ? 15 : -15));
    this.slashFx = fx;
    this.scene.tweens.add({ targets: fx, alpha: 0, scaleX: fx.scaleX * 1.15, duration: atk.duration, onComplete: () => fx.destroy() });
    GH.Sfx.swing();

    this.scene.time.delayedCall(atk.duration, () => { if (this.attackId === id) this.endAttack(); });
  }

  endAttack() {
    if (this.state !== 'attack') return;
    this.hitbox = null;
    this.slashFx = null;
    this.state = 'normal';
    this.lastAttackEnd = this.scene.time.now;
    if (this.comboQueued) {
      this.startAttack(this.comboIndex < 2 ? this.comboIndex + 1 : 0);
    } else if (this.comboIndex >= 2) {
      this.comboIndex = -1;
    }
  }

  cancelAttack() {
    this.hitbox = null;
    this.attackId = (this.attackId || 0) + 1;
    if (this.slashFx) { this.slashFx.destroy(); this.slashFx = null; }
    this.comboIndex = -1;
    this.comboQueued = false;
  }

  startDash(time) {
    const d = this.cfg.dash;
    this.cancelAttack();   // 공격 중에도 대시로 캔슬 가능 (회피 우선)

    let dir = this.facing;
    if (this.keys.left.isDown) dir = -1;
    if (this.keys.right.isDown) dir = 1;
    this.setFacing(dir);

    this.state = 'dash';
    this.dashReadyAt = time + d.cooldown;
    // 대시 공격 판정: 지나가는 적에게 피해
    this.dashHit = { damage: d.damage, knockback: d.knockback, finisher: false, hitTargets: new Set() };
    this.sprite.body.setAllowGravity(false);
    this.sprite.setVelocity(dir * d.speed, 0);
    GH.Sfx.dash();

    const trail = this.scene.time.addEvent({
      delay: 25, repeat: Math.floor(d.duration / 25),
      callback: () => {
        const ghost = this.scene.add.image(this.sprite.x, this.sprite.y, 'robot')
          .setFlipX(this.facing < 0).setTint(GH.COLORS.neonCyan).setAlpha(0.5).setDepth(9);
        this.scene.tweens.add({ targets: ghost, alpha: 0, duration: 220, onComplete: () => ghost.destroy() });
      },
    });

    const id = this.dashId = (this.dashId || 0) + 1;
    this.scene.time.delayedCall(d.duration, () => {
      trail.remove();
      this.dashHit = null;
      if (this.dashId !== id || this.state !== 'dash') return;
      this.sprite.body.setAllowGravity(true);
      this.sprite.setVelocityX(0);
      this.state = 'normal';
      // 적을 통과한 직후 몸통에 바로 부딪혀 맞지 않도록 잠깐 무적
      this.invincibleUntil = Math.max(this.invincibleUntil, this.scene.time.now + d.afterSafe);
    });
  }

  // 피격 결과: false(무적이라 무시) | 'blocked'(방패로 막음) | 'hit'(맞음)
  takeDamage(amount, fromX, kind = 'touch', source = 'unknown') {
    const scene = this.scene;
    const time = scene.time.now;
    if (this.isInvincible(time)) return false;

    // 방패: 바라보는 쪽에서 온 공격만 막음
    if (this.state === 'guard' && kind !== 'hazard' && kind !== 'blast') {
      const from = Math.sign(fromX - this.sprite.x) || this.facing;
      if (from === this.facing) return this.block(kind, time);
    }

    this.cancelAttack();
    this.endGuard();
    this.hp = Math.max(0, this.hp - amount);
    this.invincibleUntil = time + this.cfg.hurtInvincible;
    this.blinkUntil = this.invincibleUntil;
    const dir = this.sprite.x < fromX ? -1 : 1;
    this.sprite.body.setAllowGravity(true);
    this.sprite.setVelocity(dir * 260, -320);
    this.view.setTintFill(0xffffff);
    scene.time.delayedCall(80, () => { if (this.state === 'dead') this.view.setTint(0x555577); else this.view.clearTint(); });
    scene.cameras.main.shake(160, GH.CONFIG.shake.hurt);
    scene.cameras.main.flash(80, 255, 60, 100);
    GH.Sfx.hurt();
    this.lastSource = source;
    GH.Run.hit(amount, source);

    if (this.hp <= 0) {
      this.state = 'dead';
      this.view.setTint(0x555577);
      this.view.setAngle(this.facing * -90);
      scene.onPlayerDead();
      return true;
    }
    this.state = 'hurt';
    scene.time.delayedCall(this.cfg.hurtStun, () => { if (this.state === 'hurt') this.state = 'normal'; });
    return 'hit';
  }

  block(kind, time) {
    const gc = this.cfg.guard;
    const scene = this.scene;
    this.guardGauge -= gc.cost[kind] || gc.cost.touch;
    this.guardRegenAt = time + gc.regenDelay;
    this.invincibleUntil = Math.max(this.invincibleUntil, time + 250);  // 같은 공격에 연속으로 깎이지 않도록
    this.sprite.setVelocityX(-this.facing * 120);   // 막을 때 살짝 밀림

    if (this.guardGauge <= 0) {
      // 방패 깨짐: 잠깐 무방비
      this.guardGauge = 0;
      this.guardLockedUntil = time + gc.breakLock;
      this.endGuard();
      this.state = 'hurt';
      scene.time.delayedCall(gc.breakStun, () => { if (this.state === 'hurt') this.state = 'normal'; });
      this.view.setTint(0x8888aa);
      scene.time.delayedCall(gc.breakStun, () => { if (this.state !== 'dead') this.view.clearTint(); });
      scene.cameras.main.shake(180, 0.012);
      GH.Sfx.guardBreak();
      scene.popText(this.sprite.x, this.sprite.y - 50, 'GUARD BREAK', '#ff3b6b', 20);
      scene.burst(this.sprite.x + this.facing * 24, this.sprite.y, 18, GH.COLORS.neonCyan);
      return 'blocked';
    }
    this.shieldView.setTintFill(0xffffff);
    scene.time.delayedCall(70, () => this.shieldView.clearTint());
    scene.cameras.main.shake(70, 0.004);
    GH.Sfx.block();
    scene.burst(this.sprite.x + this.facing * 26, this.sprite.y, 6, GH.COLORS.neonCyan);
    return 'blocked';
  }

  dashCooldownRatio(time) {
    if (time >= this.dashReadyAt) return 1;
    return 1 - (this.dashReadyAt - time) / this.cfg.dash.cooldown;
  }
};


// ===== src/enemies.js =====
// 잡몹 2종: 돌진형 "버그 크래셔", 원거리형 "스팸 드론"
window.GH = window.GH || {};

// 난이도 배율 d 적용: 예고/대기 시간은 d로 나누고, 속도/HP는 d를 곱함
GH.scaleCfg = function (cfg, d, divKeys, mulKeys) {
  const c = { ...cfg };
  divKeys.forEach((k) => { c[k] = cfg[k] / d; });
  mulKeys.forEach((k) => { c[k] = cfg[k] * d; });
  c.hp = Math.round(cfg.hp * d);
  return c;
};

GH.Enemy = class Enemy {
  constructor(scene, x, y, key, cfg, floating) {
    this.scene = scene;
    this.cfg = cfg;
    this.sprite = scene.physics.add.sprite(x, y, key).setVisible(false);  // 물리 판정용
    this.view = scene.add.image(x, y, key).setDepth(6);                     // 보이는 그림
    this.sync = () => { if (this.sprite.active) this.view.setPosition(this.sprite.x, this.sprite.y); };
    scene.events.on('postupdate', this.sync);
    scene.events.once('shutdown', () => scene.events.off('postupdate', this.sync));
    this.sprite.owner = this;
    this.sprite.body.setAllowGravity(!floating);
    this.sprite.setCollideWorldBounds(true);
    this.hp = cfg.hp;
    this.maxHp = cfg.hp;
    this.alive = true;
    this.state = 'idle';
    this.stateUntil = 0;
    this.facing = -1;
    this.homeX = x;
    this.hpBar = scene.add.graphics().setDepth(7);
    this.warnIcon = scene.add.text(x, y - 40, '!', {
      fontFamily: 'Pretendard, sans-serif', fontSize: '28px', fontStyle: 'bold',
      color: '#ffe14f', stroke: '#ff3b6b', strokeThickness: 5,
    }).setOrigin(0.5).setDepth(20).setVisible(false);
  }

  setFacing(dir) {
    this.facing = dir;
    this.view.setFlipX(dir < 0);
  }

  setState(state, time, duration) {
    this.state = state;
    this.stateUntil = time + (duration || 0);
  }

  showWarn(on) {
    this.warnIcon.setVisible(on);
    if (on) {
      this.warnIcon.setScale(1.6);
      this.scene.tweens.add({ targets: this.warnIcon, scale: 1, duration: 200, ease: 'Back.Out' });
    }
  }

  // 플레이어 공격에 맞음
  hit(damage, dir, knockback, finisher, extraStun = 0) {
    if (!this.alive) return false;
    const scene = this.scene;
    const time = scene.time.now;
    this.hp = Math.max(0, this.hp - damage);
    this.showWarn(false);
    this.view.clearTint();
    this.view.setTintFill(0xffffff);
    scene.time.delayedCall(70, () => { if (this.alive) this.view.clearTint(); });

    // 실제로 밀려남 + 경직 (예고/돌진이 끊김)
    this.sprite.setVelocityX(dir * knockback);
    if (finisher && this.sprite.body.allowGravity) this.sprite.setVelocityY(-220);
    this.setState('stun', time, GH.CONFIG.enemies.hitStun + (finisher ? 150 : 0) + extraStun);

    // 찌그러짐
    scene.tweens.killTweensOf(this.view);
    this.view.setScale(1.25, 0.8);
    scene.tweens.add({ targets: this.view, scaleX: 1, scaleY: 1, duration: 180, ease: 'Back.Out' });

    if (this.hp <= 0) { this.die(dir); return true; }
    return false;
  }

  die(dir) {
    this.alive = false;
    this.showWarn(false);
    this.hpBar.clear();
    const s = this.view;
    const sx = this.sprite.x, sy = this.sprite.y;
    this.sprite.destroy();
    this.scene.events.off('postupdate', this.sync);
    s.setPosition(sx, sy);
    // 글리치 분열: 빨강/청록 잔상이 갈라지며 사라짐
    [[GH.COLORS.danger, -1], [GH.COLORS.neonCyan, 1]].forEach(([c, side]) => {
      const ghost = this.scene.add.image(s.x, s.y, s.texture.key).setFlipX(s.flipX).setTint(c).setAlpha(0.8).setDepth(6);
      this.scene.tweens.add({ targets: ghost, x: s.x + side * 18 + dir * 20, alpha: 0, duration: 350, onComplete: () => ghost.destroy() });
    });
    this.scene.tweens.killTweensOf(s);
    this.scene.tweens.add({
      targets: s, scaleX: 1.6, scaleY: 0.1, alpha: 0, duration: 220, ease: 'Cubic.In',
      onComplete: () => { s.destroy(); this.warnIcon.destroy(); this.hpBar.destroy(); },
    });
    this.deathX = sx; this.deathY = sy;
    this.scene.onEnemyKilled(this);
  }

  drawHp() {
    if (!this.alive) return;
    const s = this.sprite;
    this.hpBar.clear();
    if (this.hp >= this.maxHp) return;
    this.hpBar.fillStyle(0x000000, 0.6).fillRect(s.x - 20, s.y - 32, 40, 4);
    this.hpBar.fillStyle(GH.COLORS.danger, 1).fillRect(s.x - 20, s.y - 32, 40 * (this.hp / this.maxHp), 4);
    this.warnIcon.setPosition(s.x, s.y - 46);
  }
};

// ---- 돌진형: 순찰 → 발견 → 예고(!) → 돌진 → 빈틈 ----
GH.Charger = class Charger extends GH.Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'charger', GH.scaleCfg(GH.CONFIG.enemies.charger, scene.difficulty || 1, ['windup', 'recover'], ['chargeSpeed']), false);
    this.name = 'charger';
    this.sprite.body.setSize(38, 32).setOffset(5, 8);
    this.setFacing(-1);
    this.setState('patrol', 0);
  }

  update(time, player) {
    if (!this.alive) return;
    const s = this.sprite;
    const p = player.sprite;
    const c = this.cfg;
    const dx = p.x - s.x;
    const sameLevel = Math.abs(p.y - s.y) < 90;

    switch (this.state) {
      case 'patrol':
        s.setVelocityX(this.facing * c.patrolSpeed);
        if (Math.abs(s.x - this.homeX) > 90 || s.body.blocked.left || s.body.blocked.right) {
          this.setFacing(s.x > this.homeX ? -1 : 1);
        }
        if (player.state !== 'dead' && Math.abs(dx) < c.detectRange && sameLevel) {
          this.setFacing(Math.sign(dx) || 1);
          s.setVelocityX(0);
          this.setState('windup', time, c.windup);
          this.showWarn(true);
          this.view.setTint(GH.COLORS.neonYellow);
          GH.Sfx.warn();
        }
        break;
      case 'windup':
        // 뒤로 살짝 물러나며 힘을 모으는 예고 모션
        s.setVelocityX(-this.facing * 20);
        s.x += Math.sin(time / 20) * 1.2;
        if (time >= this.stateUntil) {
          this.showWarn(false);
          this.view.clearTint();
          this.setState('charge', time, c.chargeTime);
        }
        break;
      case 'charge':
        s.setVelocityX(this.facing * c.chargeSpeed);
        if (Math.floor(time / 30) % 2) {
          const g = this.scene.add.image(s.x, s.y, 'charger').setFlipX(this.view.flipX).setTint(GH.COLORS.danger).setAlpha(0.4).setDepth(5);
          this.scene.tweens.add({ targets: g, alpha: 0, duration: 180, onComplete: () => g.destroy() });
        }
        if (time >= this.stateUntil || s.body.blocked.left || s.body.blocked.right) {
          s.setVelocityX(0);
          this.setState('recover', time, c.recover);
          this.view.setAngle(this.facing * 12);   // 숨 고르는 빈틈
        }
        break;
      case 'recover':
        if (time >= this.stateUntil) { this.view.setAngle(0); this.homeX = s.x; this.setState('patrol', time); }
        break;
      case 'stun':
        s.setVelocityX(s.body.velocity.x * 0.88);
        if (time >= this.stateUntil) { this.view.setAngle(0); this.homeX = s.x; this.setState('patrol', time); }
        break;
    }
  }

  // 플레이어와 닿았을 때 주는 피해
  contactDamage() {
    if (!this.alive || this.state === 'stun') return 0;
    return this.state === 'charge' ? this.cfg.chargeDamage : this.cfg.touchDamage;
  }
};

// ---- 원거리형: 떠다니며 거리 유지 → 예고(눈이 커짐) → 발사 ----
GH.Shooter = class Shooter extends GH.Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'shooter', GH.scaleCfg(GH.CONFIG.enemies.shooter, scene.difficulty || 1, ['windup', 'cooldown'], ['bulletSpeed']), true);
    this.name = 'shooter';
    this.sprite.body.setSize(32, 24).setOffset(4, 8);
    this.baseY = y;
    this.nextShotAt = 0;
    this.setState('hover', 0);
  }

  update(time, player) {
    if (!this.alive) return;
    const s = this.sprite;
    const p = player.sprite;
    const c = this.cfg;
    const dx = p.x - s.x;
    const dist = Math.abs(dx);

    if (this.state !== 'stun') {
      s.y = this.baseY + Math.sin(time / 300 + this.homeX) * 8;
      s.setVelocityY(0);
      this.setFacing(Math.sign(dx) || 1);
    }

    switch (this.state) {
      case 'hover':
        // 너무 가까우면 뒤로 물러남
        if (dist < c.keepDistance) s.setVelocityX(-Math.sign(dx) * 110);
        else s.setVelocityX((this.homeX - s.x) * 0.8);
        if (player.state !== 'dead' && dist < c.detectRange && time >= this.nextShotAt) {
          s.setVelocityX(0);
          this.setState('windup', time, c.windup);
          this.showWarn(true);
          GH.Sfx.warn();
          this.scene.tweens.add({ targets: this.view, scale: 1.25, duration: c.windup, ease: 'Quad.In' });
          this.view.setTint(GH.COLORS.neonPink);
        }
        break;
      case 'windup':
        s.setVelocityX(0);
        if (time >= this.stateUntil) {
          this.showWarn(false);
          this.view.clearTint();
          this.view.setScale(1);
          this.fire(player);
          this.nextShotAt = time + c.cooldown;
          this.setState('hover', time);
        }
        break;
      case 'stun':
        s.setVelocityX(s.body.velocity.x * 0.85);
        if (time >= this.stateUntil) { this.view.setScale(1); this.setState('hover', time); }
        break;
    }
  }

  fire(player) {
    const s = this.sprite;
    const p = player.sprite;
    const angle = Phaser.Math.Angle.Between(s.x, s.y, p.x, p.y);
    this.scene.spawnBullet(s.x, s.y + 6, Math.cos(angle) * this.cfg.bulletSpeed, Math.sin(angle) * this.cfg.bulletSpeed, this.cfg.bulletDamage, 'shooter_bullet');
    GH.Sfx.shoot();
  }

  contactDamage() { return 0; }
};

// ---- 방패형 "방화벽 가드": 정면 공격을 막음, 뒤로 돌아서는 데 시간이 걸림 ----
GH.FirewallGuard = class FirewallGuard extends GH.Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'fguard', GH.scaleCfg(GH.CONFIG.enemies.guard, scene.difficulty || 1, ['turnDelay', 'windup', 'recover'], ['bashSpeed']), false);
    this.name = 'fguard';
    this.shielded = true;
    this.sprite.body.setSize(34, 44).setOffset(6, 8);
    this.setFacing(-1);
    this.turnAt = 0;
    this.setState('walk', 0);
  }

  // 이 공격을 방패로 막는가: 정면에서 수평으로 들어온 공격만 막음 (위에서 내려친 공격은 통과)
  blocks(attackDir, srcY) {
    if (!this.alive || this.state === 'stun') return false;
    const fromFront = attackDir === -this.facing;
    const fromAbove = srcY < this.sprite.y - 15;   // 점프해서 위쪽에서 친 공격
    return fromFront && !fromAbove;
  }

  update(time, player) {
    if (!this.alive) return;
    const s = this.sprite;
    const p = player.sprite;
    const c = this.cfg;
    const dx = p.x - s.x;
    const dir = Math.sign(dx) || 1;
    const sameLevel = Math.abs(p.y - s.y) < 90;

    switch (this.state) {
      case 'walk':
        // 플레이어가 등 뒤에 있으면 잠깐 뒤 돌아서기 (이때가 공격 기회)
        if (dir !== this.facing) {
          if (!this.turnAt) this.turnAt = time + c.turnDelay;
          if (time >= this.turnAt) { this.setFacing(dir); this.turnAt = 0; }
          s.setVelocityX(0);
        } else {
          this.turnAt = 0;
          s.setVelocityX(Math.abs(dx) > 70 && Math.abs(dx) < 600 ? this.facing * c.walkSpeed : 0);
          if (player.state !== 'dead' && Math.abs(dx) < c.bashRange && sameLevel) {
            s.setVelocityX(0);
            this.setState('windup', time, c.windup);
            this.showWarn(true);
            this.view.setTint(0xff8a3b);
            GH.Sfx.warn();
          }
        }
        break;
      case 'windup':
        s.setVelocityX(-this.facing * 30);
        if (time >= this.stateUntil) {
          this.showWarn(false);
          this.view.clearTint();
          this.setState('bash', time, c.bashTime);
        }
        break;
      case 'bash':
        s.setVelocityX(this.facing * c.bashSpeed);
        if (time >= this.stateUntil) { s.setVelocityX(0); this.setState('recover', time, c.recover); }
        break;
      case 'recover':
        if (time >= this.stateUntil) this.setState('walk', time);
        break;
      case 'stun':
        s.setVelocityX(s.body.velocity.x * 0.88);
        if (time >= this.stateUntil) { this.view.setAngle(0); this.setState('walk', time); }
        break;
    }
  }

  contactDamage() {
    if (!this.alive || this.state === 'stun') return 0;
    return this.state === 'bash' ? this.cfg.bashDamage : this.cfg.touchDamage;
  }
};


// ===== src/hazards.js =====
// 섹터 2 지형 장애물 3종 (모두 예고가 있고, 방패로는 막을 수 없음 → 타이밍, 대시, 발판으로 피함)
window.GH = window.GH || {};

// ---- 1. 레이저 벽: 꺼짐 → 예고(가는 선 깜빡임) → 켜짐 ----
GH.LaserWall = class LaserWall {
  constructor(scene, x, offsetMs = 0) {
    const d = scene.difficulty || 1;
    const c = GH.CONFIG.hazards.laser;
    this.scene = scene;
    this.x = x;
    this.c = { off: c.off / d, warn: c.warn / d, on: c.on, damage: c.damage };
    this.cycle = this.c.off + this.c.warn + this.c.on;
    this.offset = offsetMs;
    this.g = scene.add.graphics().setDepth(8);
    // 천장과 바닥의 발사 장치
    const gy = GH.CONFIG.world.groundY;
    scene.add.rectangle(x, 40, 34, 16, 0x3a2a66).setStrokeStyle(2, GH.COLORS.danger).setDepth(8);
    scene.add.rectangle(x, gy - 6, 34, 12, 0x3a2a66).setStrokeStyle(2, GH.COLORS.danger).setDepth(8);
    this.state = 'off';
  }

  update(time, player) {
    const t = (time + this.offset) % this.cycle;
    const c = this.c;
    const prev = this.state;
    this.state = t < c.off ? 'off' : t < c.off + c.warn ? 'warn' : 'on';
    const gy = GH.CONFIG.world.groundY;
    const g = this.g;
    g.clear();
    if (this.state === 'warn') {
      if (Math.floor(time / 80) % 2) { g.lineStyle(2, GH.COLORS.danger, 0.8); g.lineBetween(this.x, 48, this.x, gy - 12); }
      if (prev !== 'warn' && this.near(player, 500)) GH.Sfx.laserWarn();
    } else if (this.state === 'on') {
      g.fillStyle(GH.COLORS.danger, 0.35).fillRect(this.x - 14, 48, 28, gy - 60);
      g.fillStyle(0xffffff, 0.9).fillRect(this.x - 4, 48, 8, gy - 60);
      if (prev !== 'on' && this.near(player, 500)) GH.Sfx.laser();
      const p = player.sprite;
      if (Math.abs(p.x - this.x) < 22) player.takeDamage(c.damage, this.x, 'hazard', 'laser');
    }
  }

  near(player, r) { return Math.abs(player.sprite.x - this.x) < r; }
};

// ---- 2. 전기 바닥: 꺼짐 → 예고(불꽃 튐) → 켜짐 ----
GH.ElectricFloor = class ElectricFloor {
  constructor(scene, x0, x1, offsetMs = 0) {
    const d = scene.difficulty || 1;
    const c = GH.CONFIG.hazards.electric;
    this.scene = scene;
    this.x0 = x0; this.x1 = x1;
    this.c = { off: c.off / d, warn: c.warn / d, on: c.on, damage: c.damage };
    this.cycle = this.c.off + this.c.warn + this.c.on;
    this.offset = offsetMs;
    this.g = scene.add.graphics().setDepth(3);
    this.state = 'off';
  }

  update(time, player) {
    const t = (time + this.offset) % this.cycle;
    const c = this.c;
    const prev = this.state;
    this.state = t < c.off ? 'off' : t < c.off + c.warn ? 'warn' : 'on';
    const gy = GH.CONFIG.world.groundY;
    const g = this.g;
    g.clear();
    // 바닥 표시 (항상 보임)
    g.fillStyle(0x3a2a00, 1).fillRect(this.x0, gy - 2, this.x1 - this.x0, 6);
    g.lineStyle(2, GH.COLORS.neonYellow, this.state === 'off' ? 0.35 : 1);
    g.strokeRect(this.x0, gy - 2, this.x1 - this.x0, 6);
    if (this.state === 'warn') {
      if (Math.random() < 0.5) {
        const sx = Phaser.Math.Between(this.x0, this.x1);
        g.fillStyle(GH.COLORS.neonYellow, 1).fillRect(sx, gy - 10, 3, 8);
      }
      if (prev !== 'warn' && Math.abs(player.sprite.x - (this.x0 + this.x1) / 2) < 600) GH.Sfx.laserWarn();
    } else if (this.state === 'on') {
      // 지그재그 전기
      g.lineStyle(3, GH.COLORS.neonYellow, 1);
      g.beginPath();
      g.moveTo(this.x0, gy - 4);
      for (let x = this.x0; x <= this.x1; x += 14) g.lineTo(x, gy - 4 - Phaser.Math.Between(0, 16));
      g.strokePath();
      const p = player.sprite;
      const onFloor = p.body.bottom >= gy - 4 && p.x > this.x0 && p.x < this.x1;
      if (onFloor) player.takeDamage(c.damage, p.x, 'hazard', 'electric');
    }
  }
};

// ---- 3. 낙하 글리치 블록: 플레이어가 구역에 들어오면 그림자 예고 후 블록이 떨어짐 ----
GH.FallingBlocks = class FallingBlocks {
  constructor(scene, x0, x1) {
    const d = scene.difficulty || 1;
    const c = GH.CONFIG.hazards.blocks;
    this.scene = scene;
    this.x0 = x0; this.x1 = x1;
    this.c = { interval: c.interval / d, warn: c.warn / d, damage: c.damage, width: c.width };
    this.nextAt = 0;
    this.drops = [];
    // 구역 표시: 천장의 깨진 패널
    const g = scene.add.graphics().setDepth(2);
    for (let x = x0; x < x1; x += 40) {
      g.fillStyle(0x2a1a55, 1).fillRect(x, 20, 36, 10);
      g.fillStyle(GH.COLORS.neonPurple, 0.6).fillRect(x + Phaser.Math.Between(0, 20), 24, 10, 3);
    }
  }

  update(time, player) {
    const p = player.sprite;
    const inZone = p.x > this.x0 - 60 && p.x < this.x1 + 60;
    if (inZone && time >= this.nextAt && player.state !== 'dead') {
      this.nextAt = time + this.c.interval;
      // 플레이어 근처(조금 앞쪽)에 떨어뜨림
      const x = Phaser.Math.Clamp(p.x + player.facing * Phaser.Math.Between(0, 80), this.x0 + 20, this.x1 - 20);
      this.spawn(x, time);
    }
    const gy = GH.CONFIG.world.groundY;
    this.drops = this.drops.filter((d) => {
      if (d.state === 'warn') {
        const k = Math.min(1, (time - d.t0) / this.c.warn);
        d.shadow.setScale(0.3 + k * 0.7, 1).setAlpha(0.3 + k * 0.5);
        if (time - d.t0 >= this.c.warn) {
          d.state = 'fall';
          d.block = this.scene.add.image(d.x, -30, 'gblock').setDepth(9);
          this.scene.tweens.add({
            targets: d.block, y: gy - 22, duration: 220, ease: 'Quad.In',
            onComplete: () => this.impact(d, player),
          });
        }
        return true;
      }
      return d.state !== 'done';
    });
  }

  spawn(x, time) {
    const gy = GH.CONFIG.world.groundY;
    const shadow = this.scene.add.ellipse(x, gy, this.c.width + 10, 12, GH.COLORS.danger, 0.5).setDepth(3);
    this.drops.push({ x, t0: time, state: 'warn', shadow });
  }

  impact(d, player) {
    const scene = this.scene;
    d.state = 'done';
    d.shadow.destroy();
    scene.cameras.main.shake(100, 0.006);
    GH.Sfx.blockCrash();
    scene.burst(d.x, GH.CONFIG.world.groundY - 20, 14, GH.COLORS.neonPurple);
    const p = player.sprite;
    if (Math.abs(p.x - d.x) < this.c.width / 2 + 14 && p.y > GH.CONFIG.world.groundY - 110) {
      player.takeDamage(this.c.damage, d.x, 'hazard', 'block');
    }
    scene.tweens.add({ targets: d.block, alpha: 0, scaleY: 0.3, duration: 200, delay: 80, onComplete: () => d.block.destroy() });
  }
};


// ===== src/boss.js =====
// 보스: 폭주 AI "CORE.EXE"
// 패턴 4종 (모두 예고가 있음): 돌진 / 내려찍기 / 부채꼴 탄막 / 무력화 필살기(OVERLOAD)
window.GH = window.GH || {};

GH.Boss = class Boss extends GH.Enemy {
  constructor(scene, x, y) {
    const cfg = GH.CONFIG.boss;
    super(scene, x, y, 'boss', { hp: cfg.hp }, true);
    this.bcfg = cfg;
    this.name = 'boss';
    // 난이도 배율 d: 예고/쉬는 시간은 d로 나누고, 속도/HP/무력화 게이지는 d를 곱함
    this.d = scene.difficulty || 1;
    this.hp = this.maxHp = Math.round(cfg.hp * this.d);
    this.sprite.body.setSize(104, 86).setOffset(13, 16);
    this.sprite.setCollideWorldBounds(true);
    this.groundY = GH.CONFIG.world.groundY - 55;   // 바닥에 섰을 때의 중심 높이
    this.phase = 1;
    this.lastPattern = null;
    this.overloadDone = [];
    this.untargetable = true;
    this.tele = scene.add.graphics().setDepth(3);   // 바닥 예고 표시
    this.view.setDepth(7);

    // 등장: 위에서 떨어짐
    this.sprite.y = -80;
    this.setState('intro', scene.time.now, 1400);
    scene.tweens.add({
      targets: this.sprite, y: this.groundY, duration: 700, delay: 500, ease: 'Bounce.Out',
      onComplete: () => { scene.cameras.main.shake(250, 0.015); GH.Sfx.slam(); },
    });
  }

  // 2페이즈 배율 (예고/쉬는 시간이 짧아짐)
  t(ms) { return (this.phase === 2 ? ms * this.bcfg.phase2Speed : ms) / this.d; }

  // 보스는 맞아도 밀려나거나 경직되지 않음 (그로기 상태에서는 추가 피해)
  hit(damage, dir, knockback, finisher) {
    if (!this.alive || this.untargetable) return false;
    const scene = this.scene;
    const time = scene.time.now;
    let dmg = damage;
    if (this.state === 'groggy') dmg = Math.round(damage * this.bcfg.overload.groggyDamageMul);
    // 무력화 지점(70%, 35%)을 지나치지 않도록: 아직 발동하지 않은 지점에서 HP를 멈추고 무력화 예약
    const next = this.bcfg.overload.triggers.find((r) => !this.overloadDone.includes(r) && this.hp > this.maxHp * r);
    let floor = 0;
    if (next !== undefined) floor = Math.ceil(this.maxHp * next);
    const before = this.hp;
    this.hp = Math.max(floor, this.hp - dmg);
    this.lastDamage = before - this.hp;
    if (floor > 0 && this.hp === floor) this.pendingOverload = next;
    // HP가 무력화 지점에 멈춰 있는 동안의 공격은 보호막에 막힘을 표시
    if (this.lastDamage === 0 && damage > 0 && time > (this.shieldMsgAt || 0)) {
      this.shieldMsgAt = time + 700;
      scene.popText(this.sprite.x, this.sprite.y - 70, 'SHIELD', '#35f2ff', 16);
    }

    if (this.state === 'overload') {
      this.ovGauge = Math.max(0, this.ovGauge - damage);
      if (this.ovGauge <= 0) this.startGroggy(time);
    }

    this.view.setTintFill(0xffffff);
    scene.time.delayedCall(60, () => { if (this.alive) this.applyTint(); });
    scene.tweens.killTweensOf(this.view);
    this.view.setScale(1.06, 0.95);
    scene.tweens.add({ targets: this.view, scaleX: 1, scaleY: 1, duration: 120 });

    if (this.phase === 1 && this.hp <= this.maxHp * this.bcfg.phase2At) {
      this.phase = 2;
      // 2페이즈 전용 패턴은 시작하자마자 한 번씩 반드시 보여줌 (순서는 무작위)
      this.phase2Queue = Phaser.Utils.Array.Shuffle(['sweep', 'mirror']);
      this.phase2Left = 2;   // 두 패턴을 다 보여주기 전에는 두 번째 무력화를 미룸
      scene.banner('PHASE 2', 'CORE.EXE가 당신의 패턴을 학습했다', 1400);
    }
    if (this.hp <= 0) { this.die(dir); return true; }
    return false;
  }

  applyTint() {
    this.view.clearTint();
    if (this.state === 'groggy') this.view.setTint(0x777799);
    else if (this.phase === 2) this.view.setTint(0xffb0c8);
  }

  contactDamage() {
    if (!this.alive || this.untargetable || this.state === 'groggy' || this.state === 'intro') return 0;
    // 무력화 중에는 몸에 닿아도 피해 없음 (점프해서 때리러 오는 플레이어를 벌주지 않도록)
    if (this.state === 'overload' || this.state === 'overload_move') return 0;
    if (this.state === 'charge') return this.bcfg.charge.damage;
    if (this.state === 'mirror_charge') return this.bcfg.mirror.damage;
    if (this.state === 'mirror_move') return 0;
    return this.bcfg.touchDamage;
  }

  drawHp() { /* 보스 HP는 화면 위 큰 바로 표시 (scene.updateHud) */ }

  // ===== 패턴 선택 =====
  nextPattern(time) {
    this.view.setAngle(0);   // 이전 패턴의 기울어짐 초기화
    // HP 구간마다 무력화 필살기
    const ratio = this.hp / this.maxHp;
    const trig = this.bcfg.overload.triggers.find((r) => ratio <= r && !this.overloadDone.includes(r));
    if (trig !== undefined) {
      this.overloadDone.push(trig);
      return this.startOverload(time);
    }
    const base = this.phase === 2 ? ['charge', 'slam', 'fan', 'sweep', 'mirror'] : ['charge', 'slam', 'fan'];
    const pool = base.filter((p) => p !== this.lastPattern);
    const p = (this.phase2Queue && this.phase2Queue.length) ? this.phase2Queue.shift() : Phaser.Math.RND.pick(pool);
    this.lastPattern = p;
    if (p === 'charge') this.startChargeTelegraph(time);
    if (p === 'slam') this.startSlam(time);
    if (p === 'fan') this.startFanTelegraph(time);
    if (p === 'sweep') this.startSweep(time);
    if (p === 'mirror') this.startMirror(time);
  }

  update(time, player) {
    if (!this.alive) return;
    const s = this.sprite;
    const p = player.sprite;
    const c = this.bcfg;
    s.setVelocityY(0);

    // 예약된 무력화: 끊어도 되는 상태라면 바로 시작
    const interruptible = ['idle', 'stagger', 'slam_recover', 'charge_tel', 'fan_tel', 'sweep_tel', 'mirror_tel'];
    const holdForPhase2 = this.phase === 2 && this.phase2Left > 0;
    if (this.pendingOverload !== undefined && !holdForPhase2 && interruptible.includes(this.state)) {
      this.overloadDone.push(this.pendingOverload);
      this.pendingOverload = undefined;
      this.tele.clear();
      if (this.sweepLabel) this.sweepLabel.setVisible(false);
      this.clearMirror();
      this.applyTint();
      s.setVelocityX(0);
      this.startOverload(time);
      return;
    }

    switch (this.state) {
      case 'intro':
        if (time >= this.stateUntil) { this.untargetable = false; this.setState('idle', time, this.t(c.idle)); }
        break;

      case 'idle':
        // 플레이어 쪽으로 천천히 이동
        this.setFacing(p.x < s.x ? -1 : 1);
        s.setVelocityX(Math.abs(p.x - s.x) > 160 ? this.facing * 70 : 0);
        s.y = this.groundY + Math.sin(time / 250) * 3;
        if (time >= this.stateUntil && player.state !== 'dead') { s.setVelocityX(0); this.nextPattern(time); }
        break;

      // ---- 1. 돌진 ----
      case 'charge_tel': {
        s.x += Math.sin(time / 15) * 1.5;
        const blink = Math.floor(time / 90) % 2;
        this.tele.clear();
        this.tele.fillStyle(GH.COLORS.danger, blink ? 0.35 : 0.15);
        const x0 = this.facing > 0 ? s.x : 0;
        const x1 = this.facing > 0 ? GH.CONFIG.screen.width : s.x;
        this.tele.fillRect(x0, this.groundY - 50, x1 - x0, 100);
        if (time >= this.stateUntil) { this.tele.clear(); this.setState('charge', time, 3000); this.view.clearTint(); }
        break;
      }
      case 'charge':
        s.setVelocityX(this.facing * c.charge.speed * this.d * (this.phase === 2 ? 1.15 : 1));
        if (Math.floor(time / 30) % 2) this.afterImage(GH.COLORS.danger);
        if (s.body.blocked.left || s.body.blocked.right || time >= this.stateUntil) {
          s.setVelocityX(0);
          this.scene.cameras.main.shake(200, 0.012);
          GH.Sfx.slam();
          this.view.setAngle(this.facing * -10);
          this.setState('stagger', time, c.charge.stagger);   // 벽에 부딪혀 빈틈
        }
        break;
      case 'stagger':
        if (time >= this.stateUntil) { this.view.setAngle(0); this.setState('idle', time, this.t(c.idle)); }
        break;

      // ---- 2. 내려찍기 ----
      case 'slam_follow':
        // 예고 원이 플레이어를 따라다님
        this.slamX = Phaser.Math.Linear(this.slamX, p.x, 0.15);
        this.drawSlamMarker(time, false);
        if (time >= this.stateUntil) this.setState('slam_lock', time, this.t(c.slam.lock));
        break;
      case 'slam_lock':
        this.drawSlamMarker(time, true);   // 위치 고정 + 빠른 깜빡임
        if (time >= this.stateUntil) this.doSlam(time, player);
        break;
      case 'slam_recover':
        if (time >= this.stateUntil) this.setState('idle', time, this.t(c.idle));
        break;

      // ---- 3. 부채꼴 탄막 ----
      case 'fan_tel':
        s.setVelocityX(0);
        if (time >= this.stateUntil) {
          this.fireFan(player);
          this.volleysLeft -= 1;
          if (this.volleysLeft > 0) this.setState('fan_tel', time, c.fan.gap);
          else { this.view.clearTint(); this.applyTint(); this.setState('idle', time, this.t(c.idle)); }
        }
        break;

      // ---- 6. 미러 클론 (2페이즈 전용) ----
      case 'mirror_move':
        break;
      case 'mirror_tel':
        this.updateMirrorTelegraph(time);
        if (time >= this.stateUntil) {
          this.tele.clear();
          this.view.clearTint(); this.applyTint();
          this.setState('mirror_charge', time, 3000);
        }
        break;
      case 'mirror_charge': {
        const m = this.bcfg.mirror;
        s.setVelocityX(this.facing * m.speed * this.d);
        if (Math.floor(time / 30) % 2) this.afterImage(GH.COLORS.danger);
        this.updateFake(time, true);
        if (s.body.blocked.left || s.body.blocked.right || time >= this.stateUntil) {
          s.setVelocityX(0);
          this.clearMirror();
          this.scene.cameras.main.shake(200, 0.012);
          GH.Sfx.slam();
          this.view.setAngle(this.facing * -10);
          this.setState('stagger', time, m.stagger);
          if (this.phase2Left > 0) this.phase2Left -= 1;
        }
        break;
      }

      // ---- 5. 레이저 스윕 (2페이즈 전용) ----
      case 'sweep_move':
        break;
      case 'sweep_tel':
        this.drawSweep(time, false);
        if (time >= this.stateUntil) { this.setState('sweep_on', time, c.sweep.beam); GH.Sfx.laser(); this.scene.cameras.main.shake(c.sweep.beam, 0.004); }
        break;
      case 'sweep_on':
        this.drawSweep(time, true);
        this.checkSweepHit(player);
        if (time >= this.stateUntil) {
          this.sweepLeft -= 1;
          this.tele.clear();
          if (this.sweepLeft > 0) {
            this.nextSweepLow();
            this.setState('sweep_gap', time, c.sweep.gap);
          } else {
            this.scene.tweens.add({ targets: s, y: this.groundY, duration: 300 });
            this.setState('idle', time, this.t(c.idle));
            if (this.phase2Left > 0) this.phase2Left -= 1;
          }
        }
        break;
      case 'sweep_gap':
        if (time >= this.stateUntil) { this.setState('sweep_tel', time, this.t(c.sweep.telegraph)); GH.Sfx.laserWarn(); }
        break;

      // ---- 4. 무력화 필살기 ----
      case 'overload_move':
        break;
      case 'overload':
        this.drawOverloadRings(time);
        if (time >= this.stateUntil) this.overloadBlast(time, player);
        break;
      case 'groggy':
        if (time >= this.stateUntil) {
          this.view.setAngle(0);
          this.applyTint();
          this.setState('idle', time, this.t(c.idle));
        }
        break;
    }
  }

  afterImage(color) {
    const s = this.sprite;
    const g = this.scene.add.image(s.x, s.y, 'boss').setFlipX(this.view.flipX).setTint(color).setAlpha(0.35).setDepth(6);
    this.scene.tweens.add({ targets: g, alpha: 0, duration: 200, onComplete: () => g.destroy() });
  }

  // ===== 돌진 =====
  startChargeTelegraph(time) {
    const p = this.scene.player.sprite;
    this.setFacing(p.x < this.sprite.x ? -1 : 1);
    this.sprite.y = this.groundY;
    this.view.setTint(GH.COLORS.danger);
    this.scene.bossCallout('돌진!');
    GH.Sfx.bossWarn();
    this.setState('charge_tel', time, this.t(this.bcfg.charge.telegraph));
  }

  // ===== 내려찍기 =====
  startSlam(time) {
    const scene = this.scene;
    this.untargetable = true;
    this.setState('slam_up', time, 99999);
    scene.bossCallout('내려찍기!');
    GH.Sfx.bossWarn();
    scene.tweens.add({
      targets: this.sprite, y: -120, duration: 380, ease: 'Quad.In',
      onComplete: () => {
        this.slamX = scene.player.sprite.x;
        this.setState('slam_follow', scene.time.now, this.t(this.bcfg.slam.follow));
      },
    });
  }

  drawSlamMarker(time, locked) {
    const r = this.bcfg.slam.radius;
    const gy = GH.CONFIG.world.groundY;
    const blink = Math.floor(time / (locked ? 60 : 140)) % 2;
    this.tele.clear();
    this.tele.fillStyle(GH.COLORS.danger, blink ? 0.45 : 0.2);
    this.tele.fillEllipse(this.slamX, gy, r * 2, 28);
    this.tele.lineStyle(3, locked ? GH.COLORS.neonYellow : GH.COLORS.danger, 1);
    this.tele.strokeEllipse(this.slamX, gy, r * 2, 28);
    this.tele.lineStyle(2, GH.COLORS.danger, 0.5);
    this.tele.lineBetween(this.slamX, 0, this.slamX, gy);
  }

  doSlam(time, player) {
    const scene = this.scene;
    const c = this.bcfg.slam;
    this.setState('slam_falling', time, 99999);
    this.sprite.x = this.slamX;
    scene.tweens.add({
      targets: this.sprite, y: this.groundY, duration: 160, ease: 'Quad.In',
      onComplete: () => {
        this.tele.clear();
        this.untargetable = false;
        scene.cameras.main.shake(300, 0.02);
        GH.Sfx.slam();
        // 충격파
        const ring = scene.add.ellipse(this.slamX, GH.CONFIG.world.groundY, 20, 10).setStrokeStyle(5, GH.COLORS.neonPink).setDepth(15);
        scene.tweens.add({ targets: ring, width: c.radius * 2.6, height: 40, alpha: 0, duration: 350, onComplete: () => ring.destroy() });
        scene.burst(this.slamX, GH.CONFIG.world.groundY - 10, 30, GH.COLORS.danger);
        // 범위 안 + 땅 근처에 있으면 피해 (발판 위로 피하면 안전)
        const p = player.sprite;
        const nearGround = p.y > GH.CONFIG.world.groundY - 90;
        if (Math.abs(p.x - this.slamX) <= c.radius && nearGround) player.takeDamage(c.damage, this.slamX, 'charge', 'boss_slam');
        this.setState('slam_recover', scene.time.now, c.recover);
      },
    });
  }

  // ===== 부채꼴 탄막 =====
  startFanTelegraph(time) {
    this.volleysLeft = this.bcfg.fan.volleys + (this.phase === 2 ? 1 : 0);
    this.view.setTint(GH.COLORS.neonPink);
    this.scene.bossCallout('탄막!');
    GH.Sfx.bossWarn();
    // 팔을 들고 빛나는 예고
    this.scene.tweens.add({ targets: this.view, scaleY: 1.12, duration: 200, yoyo: true, repeat: 1 });
    this.setState('fan_tel', time, this.t(this.bcfg.fan.telegraph));
  }

  fireFan(player) {
    const f = this.bcfg.fan;
    const s = this.sprite;
    const base = Phaser.Math.Angle.Between(s.x, s.y, player.sprite.x, player.sprite.y);
    const spread = Phaser.Math.DegToRad(f.spread);
    // 짝수/홀수 볼리를 엇갈리게 해서 빈틈 위치가 바뀜
    const offset = (this.volleysLeft % 2) * (spread / (f.bullets - 1)) * 0.5;
    for (let i = 0; i < f.bullets; i++) {
      const a = base - spread / 2 + (spread * i) / (f.bullets - 1) + offset;
      const sp = f.speed * this.d;
      this.scene.spawnBullet(s.x, s.y, Math.cos(a) * sp, Math.sin(a) * sp, f.damage, 'boss_fan');
    }
    GH.Sfx.shoot();
  }

  // ===== 미러 클론 (2페이즈 전용) =====
  startMirror(time) {
    const scene = this.scene;
    const W = GH.CONFIG.screen.width;
    const realLeft = Math.random() < 0.5;
    const realX = realLeft ? 70 : W - 70;
    const fakeX = realLeft ? W - 70 : 70;
    scene.bossCallout('미러!');
    GH.Sfx.bossWarn();
    this.setState('mirror_move', time, 99999);
    // 글리치 순간이동: 깜빡이며 진짜는 한쪽 끝으로
    scene.tweens.add({ targets: this.view, alpha: 0.2, duration: 80, yoyo: true, repeat: 2 });
    scene.time.delayedCall(300, () => {
      if (!this.alive) return;
      this.sprite.setPosition(realX, this.groundY);
      this.setFacing(realLeft ? 1 : -1);
      // 가짜: 보이기만 하는 분신
      this.fake = scene.add.image(fakeX, this.groundY, 'boss').setDepth(7).setFlipX(!realLeft ? false : true);
      this.fake.dir = realLeft ? -1 : 1;
      this.fake.setFlipX(this.fake.dir < 0);
      this.fake.alive = true;
      this.fakeHit = new Set();
      GH.Sfx.overload();
      this.setState('mirror_tel', scene.time.now, this.t(this.bcfg.mirror.telegraph));
    });
  }

  updateMirrorTelegraph(time) {
    const g = this.tele;
    g.clear();
    const gy = this.groundY;
    // 양쪽에서 가운데로 향하는 돌진 예고 띠
    const blink = Math.floor(time / 90) % 2;
    g.fillStyle(GH.COLORS.danger, blink ? 0.22 : 0.1).fillRect(0, gy - 45, GH.CONFIG.screen.width, 90);
    // 진짜: 눈이 노랗게 깜빡
    const pulse = Math.floor(time / 220) % 2;
    if (pulse) this.view.setTint(GH.COLORS.neonYellow); else this.applyTint();
    this.view.setAlpha(1);
    this.updateFake(time, false);
  }

  // 가짜 분신: 반투명 + 지직거림. 예고 중 공격받으면 깨짐, 돌진 중엔 피해 없이 통과
  updateFake(time, moving) {
    const f = this.fake;
    if (!f || !f.alive) return;
    const scene = this.scene;
    if (moving) f.x += f.dir * this.bcfg.mirror.speed * this.d * (scene.game.loop.delta / 1000);
    f.setAlpha(0.45 + Math.random() * 0.25);
    f.y = this.groundY + Phaser.Math.Between(-2, 2);
    f.setTint(Phaser.Math.RND.pick([0xff6080, 0x60f0ff, 0xb090ff]));
    if (moving && Math.floor(time / 30) % 2) {
      const ghost = scene.add.image(f.x, f.y, 'boss').setFlipX(f.flipX).setTint(GH.COLORS.neonCyan).setAlpha(0.2).setDepth(6);
      scene.tweens.add({ targets: ghost, alpha: 0, duration: 160, onComplete: () => ghost.destroy() });
    }
    if (f.x < -80 || f.x > GH.CONFIG.screen.width + 80) { this.clearMirror(); return; }
    if (moving) return;
    // 예고 중: 플레이어 공격(근접, 파동, 사격)에 닿으면 깨짐
    const fb = f.getBounds();
    const pl = scene.player;
    let hit = pl.hitbox && Phaser.Geom.Intersects.RectangleToRectangle(pl.hitbox.rect, fb);
    if (!hit && scene.waves) hit = scene.waves.some((w) => Phaser.Geom.Intersects.RectangleToRectangle(w.img.getBounds(), fb));
    if (!hit && scene.pbullets) {
      scene.pbullets.getChildren().forEach((b) => {
        if (!hit && Phaser.Geom.Intersects.RectangleToRectangle(b.getBounds(), fb)) { hit = true; b.destroy(); }
      });
    }
    if (hit) this.shatterFake();
  }

  shatterFake() {
    const f = this.fake;
    const scene = this.scene;
    f.alive = false;
    GH.Sfx.parry();
    scene.popText(f.x, f.y - 60, 'FAKE!', '#35f2ff', 26);
    scene.burst(f.x, f.y, 30, GH.COLORS.neonCyan);
    scene.tweens.add({ targets: f, scaleX: 1.6, scaleY: 0.1, alpha: 0, duration: 220, onComplete: () => f.destroy() });
    this.fake = null;
  }

  clearMirror() {
    if (this.fake) {
      const f = this.fake;
      this.fake = null;
      this.scene.tweens.add({ targets: f, alpha: 0, duration: 200, onComplete: () => f.destroy() });
    }
  }

  sourceName(kind) {
    if (this.state === 'mirror_charge') return 'boss_mirror';
    return `boss_${kind}`;
  }

  // ===== 레이저 스윕 (2페이즈 전용) =====
  startSweep(time) {
    const scene = this.scene;
    const c = this.bcfg.sweep;
    // 플레이어에게서 먼 쪽 화면 끝으로 이동
    const W = GH.CONFIG.screen.width;
    const toLeft = scene.player.sprite.x > W / 2;
    this.sweepX = toLeft ? 70 : W - 70;
    this.setFacing(toLeft ? 1 : -1);
    this.sweepLeft = c.count;
    // 높낮이를 섞되, 낮은 것과 높은 것이 최소 한 번씩 나오도록
    const seq = [true, false, Phaser.Math.RND.pick([true, false])];
    this.sweepSeq = Phaser.Utils.Array.Shuffle(seq);
    this.nextSweepLow();
    scene.bossCallout('레이저!');
    GH.Sfx.bossWarn();
    this.setState('sweep_move', time, 99999);
    scene.tweens.add({
      targets: this.sprite, x: this.sweepX, y: this.groundY - 40, duration: 500, ease: 'Sine.InOut',
      onComplete: () => this.setState('sweep_tel', scene.time.now, this.t(c.telegraph)),
    });
  }

  nextSweepLow() {
    this.sweepLow = this.sweepSeq[this.bcfg.sweep.count - this.sweepLeft];
  }

  drawSweep(time, on) {
    const c = this.bcfg.sweep;
    const y = this.sweepLow ? c.lowY : c.highY;
    const W = GH.CONFIG.screen.width;
    const g = this.tele;
    g.clear();
    if (!on) {
      // 예고: 깜빡이는 점선 + 대처 표시
      const blink = Math.floor(time / 100) % 2;
      g.lineStyle(2, GH.COLORS.danger, blink ? 1 : 0.4);
      for (let x = 0; x < W; x += 24) g.lineBetween(x, y, x + 12, y);
      g.fillStyle(GH.COLORS.danger, 0.12).fillRect(0, y - c.thickness / 2, W, c.thickness);
      if (!this.sweepLabel) {
        this.sweepLabel = this.scene.add.text(0, 0, '', {
          fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '15px', fontStyle: 'bold',
          color: '#ffe14f', stroke: '#000000', strokeThickness: 4,
        }).setOrigin(0.5).setDepth(20);
      }
      this.sweepLabel.setText(this.sweepLow ? '▲ 점프!' : '▼ 땅에서 버텨!').setPosition(W / 2, y - 26).setVisible(true);
    } else {
      if (this.sweepLabel) this.sweepLabel.setVisible(false);
      g.fillStyle(GH.COLORS.danger, 0.45).fillRect(0, y - c.thickness / 2, W, c.thickness);
      g.fillStyle(0xffffff, 0.95).fillRect(0, y - 4, W, 8);
    }
  }

  checkSweepHit(player) {
    const c = this.bcfg.sweep;
    const y = this.sweepLow ? c.lowY : c.highY;
    const b = player.sprite.getBounds();
    if (b.bottom > y - c.thickness / 2 && b.top < y + c.thickness / 2) {
      player.takeDamage(c.damage, this.sprite.x, 'hazard', 'boss_sweep');
    }
  }

  // ===== 무력화 필살기 =====
  startOverload(time) {
    const scene = this.scene;
    const o = this.bcfg.overload;
    this.tele.clear();
    this.view.setAngle(0);
    this.setState('overload_move', time, 99999);
    scene.banner('OVERLOAD', '제한 시간 안에 무력화 게이지를 깎아라!', 1500);
    GH.Sfx.overload();
    scene.tweens.add({
      targets: this.sprite, x: GH.CONFIG.screen.width / 2, y: this.groundY - o.hoverHeight, duration: 600, ease: 'Sine.InOut',
      onComplete: () => {
        this.ovGauge = Math.round(o.gauge * this.d);
        this.ovGaugeMax = this.ovGauge;
        this.ovStart = scene.time.now;
        this.view.setTint(GH.COLORS.neonYellow);
        this.setState('overload', scene.time.now, o.time);
      },
    });
  }

  drawOverloadRings(time) {
    if (Math.floor(time / 120) % 3 === 0 && !this.ringCooldown) {
      this.ringCooldown = true;
      const ring = this.scene.add.circle(this.sprite.x, this.sprite.y, 140).setStrokeStyle(3, GH.COLORS.neonYellow).setDepth(5);
      this.scene.tweens.add({ targets: ring, radius: 20, alpha: 0, duration: 500, onComplete: () => ring.destroy() });
      this.scene.time.delayedCall(140, () => { this.ringCooldown = false; });
    }
    this.sprite.x = GH.CONFIG.screen.width / 2 + Math.sin(time / 30) * 2;
  }

  startGroggy(time) {
    const scene = this.scene;
    this.setState('groggy', time, this.bcfg.overload.groggy);
    scene.tweens.killTweensOf(this.sprite);
    scene.tweens.add({ targets: this.sprite, y: this.groundY, duration: 300, ease: 'Bounce.Out' });
    this.view.setAngle(-14);
    this.view.setTint(0x777799);
    GH.Sfx.groggy();
    scene.cameras.main.shake(250, 0.015);
    scene.banner('GROGGY!', '무력화 성공! 지금이 기회다 (받는 피해 1.5배)', 1500);
    if (scene.onOverloadResult) scene.onOverloadResult(true, 0);
  }

  overloadBlast(time, player) {
    const scene = this.scene;
    const o = this.bcfg.overload;
    scene.cameras.main.flash(400, 255, 80, 160);
    scene.cameras.main.shake(500, 0.03);
    GH.Sfx.blast();
    // 무력화 실패: 최대 HP의 50% 피해 (방패와 무적으로도 막을 수 없음)
    if (player.state !== 'dead') {
      player.invincibleUntil = 0;
      if (player.state === 'guard') player.endGuard();
      if (player.state === 'dash') { player.sprite.body.setAllowGravity(true); player.dashHit = null; player.state = 'normal'; }
      player.takeDamage(Math.round(GH.CONFIG.player.maxHp * o.failDamageRatio), this.sprite.x, 'blast', 'boss_overload');
    }
    // 실패 시 게이지가 얼마나 남았는지 기록 (방법을 몰랐는지, 아슬아슬했는지 구분)
    const left = this.ovGaugeMax ? this.ovGauge / this.ovGaugeMax : 1;
    if (scene.onOverloadResult) scene.onOverloadResult(false, left);
    this.applyTint();
    scene.tweens.add({ targets: this.sprite, y: this.groundY, duration: 400, ease: 'Quad.In' });
    this.setState('idle', time, this.t(this.bcfg.idle) + 600);
  }
};


// ===== src/scenes/SectorScene.js =====
// SECTOR 1: 잡몹 구간 - 전부 처치하면 출구 게이트가 열림
window.GH = window.GH || {};

GH.SectorScene = class SectorScene extends Phaser.Scene {
  constructor(key) { super(key || 'Sector'); }

  // 섹터 구성 (보스 섹터는 이 함수들을 덮어씀)
  levelConfig() {
    return {
      width: GH.CONFIG.world.width,
      id: 'S1', name: 'SECTOR 1', title: 'SECTOR 1', sub: '버그 구역을 정화하라',
      platforms: [[470, 380], [700, 320], [1150, 370], [1400, 300], [1880, 375], [2130, 315]],
      playerX: 120, gate: true, next: 'Sector2',
    };
  }

  spawnEnemies(groundY) {
    [800, 1350, 2000].forEach((x) => this.enemies.push(new GH.Charger(this, x, groundY - 25)));
    [[1020, 300], [1700, 280], [2300, 260]].forEach(([x, y]) => this.enemies.push(new GH.Shooter(this, x, y)));
  }

  spawnHazards() { /* 섹터 1은 장애물 없음 */ }

  create() {
    const L = this.levelConfig();
    this.L = L;
    GH.Run.init();
    this.difficulty = GH.Run.startAttempt(L.id);   // 시도 시작 기록 + 이번 시도의 난이도
    const W = L.width;
    this.worldW = W;
    const H = GH.CONFIG.screen.height;
    const groundY = GH.CONFIG.world.groundY;
    if (!this.textures.exists('robot')) GH.makeTextures(this);
    // 재시작 시 이전 판의 상태 초기화
    this.waves = [];
    this.cleared = false;
    this.bannerGroup = null;
    this.ovLabel = null;
    this.ovHint = null;
    this.victory = false;

    this.physics.world.setBounds(0, 0, W, H);
    this.cameras.main.setBounds(0, 0, W, H);
    this.drawBackground(W, H, groundY);

    // ---- 바닥과 발판 (점프 최대 높이 약 170px 안에서 계단식 배치) ----
    this.solids = this.physics.add.staticGroup();
    const ground = this.add.rectangle(W / 2, groundY + 35, W, 70, GH.COLORS.ground);
    this.physics.add.existing(ground, true);
    this.solids.add(ground);
    L.platforms.forEach(([x, y]) => {
      const plat = this.solids.create(x, y, 'platform');
      // 아래에서는 통과, 위에서는 밟을 수 있는 발판
      plat.body.checkCollision.down = false;
      plat.body.checkCollision.left = false;
      plat.body.checkCollision.right = false;
    });

    // ---- 출구 게이트 (전멸 시 열림) ----
    this.gateOpen = false;
    if (L.gate) this.gate = this.add.image(W - 70, groundY - 60, 'gate').setDepth(4).setAlpha(0.35);
    this.startTime = this.time.now;

    // ---- 플레이어 ----
    this.player = new GH.Player(this, L.playerX, groundY - 60);
    this.physics.add.collider(this.player.sprite, this.solids);
    this.cameras.main.startFollow(this.player.sprite, true, 0.12, 0.12);
    this.cameras.main.setFollowOffset(-80, 0);

    // ---- 적 배치 ----
    this.enemies = [];
    this.spawnEnemies(groundY);
    this.hazards = [];
    this.spawnHazards();
    this.enemies.forEach((e) => this.physics.add.collider(e.sprite, this.solids));
    this.totalEnemies = this.enemies.length;
    this.kills = 0;

    // ---- 적 탄 ----
    this.bullets = this.physics.add.group({ allowGravity: false });
    this.physics.add.collider(this.bullets, this.solids, (b) => this.popBullet(b));

    // ---- 플레이어 탄 ----
    this.pbullets = this.physics.add.group({ allowGravity: false });
    this.physics.add.collider(this.pbullets, this.solids, (b) => this.popBullet(b));

    // ---- 접촉 피해 ----
    this.physics.add.overlap(this.player.sprite, this.bullets, (ps, b) => {
      if (this.player.takeDamage(b.damage, b.x, 'bullet', b.source || 'bullet')) this.popBullet(b);
    });

    // ---- 콤보 카운터 ----
    this.comboCount = 0;
    this.lastHitTime = 0;

    // ---- 입력: 소리 켜기, 음소거, 재시작 ----
    this.input.keyboard.on('keydown', () => GH.Sfx.init());
    this.input.keyboard.on('keydown-M', () => {
      const m = GH.Sfx.toggleMute();
      this.toast(m ? '소리 꺼짐' : '소리 켜짐');
    });
    // 디버그(?debug=1): L 키로 로그 파일 다운로드
    this.input.keyboard.on('keydown-L', () => { if (GH.Run.debug) GH.Run.downloadLogs(); });
    this.input.keyboard.on('keydown-R', () => {
      if (this.victory) this.scene.start('Sector');          // 엔딩 후: 처음부터 새 판
      else if (this.player.state === 'dead' || this.cleared) this.scene.restart();
    });

    this.createHud(L.name);
    // 버전 표시 (어떤 버전으로 플레이 중인지 항상 확인 가능)
    this.add.text(950, 532, GH.CONFIG.version, { fontFamily: 'monospace', fontSize: '11px', color: '#ffffff' })
      .setOrigin(1, 1).setScrollFactor(0).setDepth(300).setAlpha(0.45);
    if (L.id === 'S1') {
      this.add.text(20, 522, '※ 게임 개선을 위해 익명 플레이 기록(클리어 시간, 피격 횟수 등)이 수집됩니다', {
        fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '11px', color: '#ffffff',
      }).setScrollFactor(0).setDepth(100).setAlpha(0.5);
    }
    if (GH.Run.debug) {
      const sk = GH.Run.skill === null ? '-' : GH.Run.skill;
      this.add.text(20, 488, `[DEBUG] group=${GH.Run.group}  skill=${sk}  difficulty=x${this.difficulty}  attempt=${GH.Run.attempts[L.id]}  (L: 로그 다운로드)`, {
        fontFamily: 'monospace', fontSize: '12px', color: '#ffe14f', backgroundColor: '#000000aa',
      }).setScrollFactor(0).setDepth(300);
    }
    this.banner(L.title, L.sub, 1600);
  }

  // ===== 배경 =====
  drawBackground(W, H, groundY) {
    const C = GH.COLORS;
    const sky = this.add.graphics().setScrollFactor(0);
    sky.fillGradientStyle(C.bgTop, C.bgTop, C.bgBottom, C.bgBottom, 1);
    sky.fillRect(0, 0, GH.CONFIG.screen.width, H);

    const stars = this.add.graphics().setScrollFactor(0.1);
    for (let i = 0; i < 80; i++) {
      stars.fillStyle(Phaser.Math.RND.pick([C.neonCyan, C.neonPink, 0xffffff]), Phaser.Math.FloatBetween(0.3, 0.9));
      stars.fillRect(Phaser.Math.Between(0, W), Phaser.Math.Between(0, groundY - 150), 2, 2);
    }
    [
      { factor: 0.3, color: 0x221447, minH: 120, maxH: 260, win: C.neonPurple },
      { factor: 0.6, color: 0x170d33, minH: 80, maxH: 200, win: C.neonPink },
    ].forEach((L) => {
      const g = this.add.graphics().setScrollFactor(L.factor);
      let x = -50;
      while (x < W * L.factor + GH.CONFIG.screen.width + 100) {
        const bw = Phaser.Math.Between(60, 130);
        const bh = Phaser.Math.Between(L.minH, L.maxH);
        g.fillStyle(L.color, 1);
        g.fillRect(x, groundY - bh, bw, bh);
        for (let wy = groundY - bh + 12; wy < groundY - 10; wy += 18) {
          for (let wx = x + 8; wx < x + bw - 10; wx += 16) {
            if (Math.random() < 0.35) {
              g.fillStyle(L.win, Phaser.Math.FloatBetween(0.3, 0.8));
              g.fillRect(wx, wy, 6, 4);
            }
          }
        }
        x += bw + Phaser.Math.Between(6, 30);
      }
    });
    const floor = this.add.graphics();
    floor.lineStyle(2, C.neonCyan, 0.9);
    floor.lineBetween(0, groundY, W, groundY);
    floor.lineStyle(1, C.neonPurple, 0.35);
    for (let x = 0; x < W; x += 60) floor.lineBetween(x, groundY, x - 40, H);
  }

  // ===== 매 프레임 =====
  update(time) {
    this.player.update(time);
    if (this.physics.world.isPaused) return;   // 히트스톱 중

    this.enemies.forEach((e) => {
      e.update(time, this.player);
      e.drawHp();
      // 몸통 접촉 피해
      if (e.alive && !e.untargetable && this.player.state !== 'dead') {
        const dmg = e.contactDamage();
        if (dmg > 0 && Phaser.Geom.Intersects.RectangleToRectangle(this.player.sprite.getBounds(), e.sprite.getBounds())) {
          const kind = (e.state === 'charge' || e.state === 'bash' || e.state === 'mirror_charge') ? 'charge' : 'touch';
          const src = e.sourceName ? e.sourceName(kind) : `${e.name}_${kind}`;
          const r = this.player.takeDamage(dmg, e.sprite.x, kind, src);
          if (r === 'blocked') {
            // 방패에 막힌 적은 튕겨 나가며 경직
            e.hit(0, this.player.facing, kind === 'charge' ? 420 : 240, false);
            this.popText(e.sprite.x, e.sprite.y - 40, 'GUARD', '#35f2ff', 18);
          }
        }
      }
    });

    // 지형 장애물
    this.hazards.forEach((h) => h.update(time, this.player));

    // 에너지 파동 이동과 명중
    this.updateWaves();

    // 대시 공격: 대시로 지나간 적
    const dh = this.player.dashHit;
    if (dh) {
      const pr = this.player.sprite.getBounds();
      Phaser.Geom.Rectangle.Inflate(pr, 10, 4);
      this.enemies.forEach((e) => {
        if (!e.alive || e.untargetable || dh.hitTargets.has(e)) return;
        if (Phaser.Geom.Intersects.RectangleToRectangle(pr, e.sprite.getBounds())) {
          dh.hitTargets.add(e);
          // 대시 방향의 반대쪽(로봇 뒤)으로 튕겨서 통과하는 느낌
          this.onHitEnemy(e, { ...dh, dir: -this.player.facing, attackDir: this.player.facing, extraStun: GH.CONFIG.player.dash.stun });
          this.popText(e.sprite.x, e.sprite.y - 62, 'DASH!', '#35f2ff', 16);
        }
      });
    }

    // 플레이어 탄 명중
    this.pbullets.getChildren().slice().forEach((b) => {
      const hitEnemy = this.enemies.find((e) => e.alive && !e.untargetable && Phaser.Geom.Intersects.RectangleToRectangle(b.getBounds(), e.sprite.getBounds()));
      if (hitEnemy) {
        this.onHitEnemy(hitEnemy, { damage: b.damage, knockback: GH.CONFIG.player.shot.knockback, finisher: false, dir: Math.sign(b.body.velocity.x) || 1, light: true, srcY: b.y });
        b.destroy();
      } else if (b.x < -50 || b.x > this.worldW + 50) b.destroy();
    });

    // 화면 밖으로 나간 탄 정리
    this.bullets.getChildren().slice().forEach((b) => {
      if (b.x < -50 || b.x > this.worldW + 50 || b.y < -50 || b.y > 600) b.destroy();
    });

    this.checkHits();

    // 게이트 진입
    if (this.gateOpen && !this.cleared && Math.abs(this.player.sprite.x - this.gate.x) < 40) {
      this.cleared = true;
      GH.Run.endAttempt('clear', { hp_left: this.player.hp });
      this.cameras.main.fadeOut(400, 0, 0, 0);
      this.time.delayedCall(450, () => this.scene.start(this.L.next));
    }

    if (time - this.lastHitTime > 1500 && this.comboCount > 0) {
      this.comboCount = 0;
      this.comboText.setAlpha(0);
    }
    this.updateHud(time);
  }

  // ===== 공격 판정 =====
  checkHits() {
    const hb = this.player.hitbox;
    if (!hb) return;
    this.enemies.forEach((e) => {
      if (!e.alive || e.untargetable || hb.hitTargets.has(e)) return;
      if (Phaser.Geom.Intersects.RectangleToRectangle(hb.rect, e.sprite.getBounds())) {
        hb.hitTargets.add(e);
        this.onHitEnemy(e, hb);
      }
    });
    // 탄 베기 (패링)
    this.bullets.getChildren().slice().forEach((b) => {
      if (Phaser.Geom.Intersects.RectangleToRectangle(hb.rect, b.getBounds())) {
        GH.Sfx.parry();
        this.burst(b.x, b.y, 8, GH.COLORS.neonYellow);
        this.popText(b.x, b.y - 20, 'PARRY', '#ffe14f', 18);
        b.destroy();
      }
    });
  }

  onHitEnemy(e, hb) {
    const dir = hb.dir || this.player.facing;
    // 방패형 적: 정면에서 수평으로 들어온 공격은 막힘
    if (e.shielded) {
      const attackDir = hb.attackDir || dir;
      const srcY = hb.srcY !== undefined ? hb.srcY : this.player.sprite.y;
      if (e.blocks(attackDir, srcY)) { this.onShieldBlock(e); return; }
    }
    const killed = e.hit(hb.damage, dir, hb.knockback, hb.finisher, hb.extraStun || 0);

    const stop = killed ? GH.CONFIG.hitstop.kill : hb.finisher ? GH.CONFIG.hitstop.finisher : hb.light ? 25 : GH.CONFIG.hitstop.normal;
    this.hitstop(stop);
    const shake = killed ? GH.CONFIG.shake.kill : hb.finisher ? GH.CONFIG.shake.finisher : hb.light ? 0.002 : GH.CONFIG.shake.hit;
    this.cameras.main.shake(killed || hb.finisher ? 140 : 80, shake);
    if (killed) GH.Sfx.kill(); else if (hb.finisher) GH.Sfx.finisher(); else GH.Sfx.hit();

    const s = e.sprite;
    this.hitSpark(s.x - dir * 8, s.y, hb.finisher || killed);
    const shown = e.lastDamage !== undefined ? e.lastDamage : hb.damage;
    if (shown > 0) this.popText(s.x, s.y - 40, String(shown), hb.finisher ? '#ffe14f' : '#ffffff', hb.finisher ? 30 : 22);

    this.comboCount += 1;
    this.lastHitTime = this.time.now;
    this.comboText.setText(`${this.comboCount} HIT`).setAlpha(1).setScale(1.4);
    this.tweens.add({ targets: this.comboText, scale: 1, duration: 150, ease: 'Back.Out' });
  }

  onShieldBlock(e) {
    const s = e.sprite;
    GH.Sfx.clank();
    this.hitstop(40);
    this.cameras.main.shake(60, 0.003);
    const sx = s.x + e.facing * 22;
    this.burst(sx, s.y, 8, GH.COLORS.neonCyan);
    const flash = this.add.rectangle(sx, s.y, 10, 50, 0xffffff, 0.9).setDepth(16);
    this.tweens.add({ targets: flash, alpha: 0, scaleX: 2, duration: 120, onComplete: () => flash.destroy() });
    this.popText(s.x, s.y - 46, 'BLOCK', '#35f2ff', 18);
    if (!this.blockHintShown) {
      this.blockHintShown = true;
      this.toast('방패는 정면만 막아요. 대시로 통과해서 등 뒤나 위에서 공격하세요!');
    }
  }

  hitstop(ms) {
    this.physics.world.pause();
    this.time.delayedCall(ms, () => this.physics.world.resume());
  }

  onEnemyKilled(e) {
    this.kills += 1;
    this.burst(e.deathX, e.deathY, 26, GH.COLORS.neonPurple);
    if (this.kills >= this.totalEnemies) {
      this.time.delayedCall(500, () => {
        this.gateOpen = true;
        this.gate.setAlpha(1);
        this.tweens.add({ targets: this.gate, alpha: 0.6, duration: 400, yoyo: true, repeat: -1 });
