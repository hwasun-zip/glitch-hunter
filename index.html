        GH.Sfx.clear();
        this.banner('SECTOR CLEAR', '오른쪽 끝 게이트로 이동하세요', 2200);
      });
    }
  }

  onPlayerDead() {
    GH.Run.endAttempt('death', { hp_left: 0 });
    this.time.delayedCall(600, () => this.banner('SYSTEM DOWN', 'R 키를 눌러 다시 시작', 0));
  }

  // ===== 탄 =====
  spawnBullet(x, y, vx, vy, damage, source) {
    const b = this.bullets.create(x, y, 'bullet').setDepth(8);
    b.body.setCircle(6, 2, 2);
    b.setVelocity(vx, vy);
    b.damage = damage;
    b.source = source || 'bullet';
  }

  // ===== 에너지 파동 =====
  spawnWave(x, y, dir, atk, big, hitTargets, angleDeg = 0) {
    const img = this.add.image(x, y, 'wave').setDepth(12).setFlipX(dir < 0);
    const rad = Phaser.Math.DegToRad(angleDeg);
    img.setAngle(-angleDeg * dir);
    img.setScale(big ? 1.5 : 0.9, big ? 1.4 : 0.85);
    if (big) img.setTint(GH.COLORS.neonPink);
    if (!this.waves) this.waves = [];
    this.waves.push({
      img, dir, big, hitTargets, cos: Math.cos(rad), sin: Math.sin(rad),
      speed: atk.waveSpeed, maxDist: atk.waveDistance, traveled: 0,
      damage: atk.damage, knockback: atk.knockback,
    });
  }

  updateWaves() {
    if (!this.waves) return;
    const dt = this.game.loop.delta / 1000;
    this.waves = this.waves.filter((w) => {
      const step = w.speed * dt;
      w.img.x += w.dir * step * w.cos;
      w.img.y -= step * w.sin;
      w.traveled += step;
      const life = w.traveled / w.maxDist;
      w.img.setAlpha(1 - life * 0.8);
      // 잔상
      if (Math.random() < 0.5) {
        const tr = this.add.image(w.img.x, w.img.y, 'wave').setFlipX(w.dir < 0).setScale(w.img.scaleX, w.img.scaleY).setAngle(w.img.angle)
          .setTint(w.big ? GH.COLORS.neonPink : GH.COLORS.neonCyan).setAlpha(0.3).setDepth(11);
        this.tweens.add({ targets: tr, alpha: 0, duration: 120, onComplete: () => tr.destroy() });
      }
      const wr = w.img.getBounds();
      this.enemies.forEach((e) => {
        if (!e.alive || e.untargetable || w.hitTargets.has(e)) return;
        if (Phaser.Geom.Intersects.RectangleToRectangle(wr, e.sprite.getBounds())) {
          w.hitTargets.add(e);
          this.onHitEnemy(e, { damage: w.damage, knockback: w.knockback, finisher: w.big, dir: w.dir, srcY: w.img.y });
        }
      });
      // 적 탄 지우기
      this.bullets.getChildren().slice().forEach((b) => {
        if (Phaser.Geom.Intersects.RectangleToRectangle(wr, b.getBounds())) {
          GH.Sfx.parry();
          this.burst(b.x, b.y, 8, GH.COLORS.neonYellow);
          this.popText(b.x, b.y - 20, 'PARRY', '#ffe14f', 18);
          b.destroy();
        }
      });
      if (w.traveled >= w.maxDist) {
        this.tweens.add({ targets: w.img, alpha: 0, scaleY: 0.2, duration: 80, onComplete: () => w.img.destroy() });
        return false;
      }
      return true;
    });
  }

  spawnPlayerBullet(x, y, vx, vy, damage) {
    const b = this.pbullets.create(x, y, 'pbullet').setDepth(9);
    b.setFlipX(vx < 0);
    b.body.setSize(18, 8);
    b.setVelocity(vx, vy);
    b.damage = damage;
    // 총구 섬광
    const m = this.add.circle(x, y, 8, GH.COLORS.neonCyan).setDepth(12);
    this.tweens.add({ targets: m, scale: 0.2, alpha: 0, duration: 90, onComplete: () => m.destroy() });
  }

  popBullet(b) {
    this.burst(b.x, b.y, 5, GH.COLORS.neonPink);
    b.destroy();
  }

  // ===== 연출 =====
  hitSpark(x, y, big) {
    const C = GH.COLORS;
    // 십자 섬광
    const flash = this.add.graphics().setDepth(16);
    flash.fillStyle(0xffffff, 1);
    const L = big ? 46 : 30;
    flash.fillRect(x - L, y - 2, L * 2, 4);
    flash.fillRect(x - 2, y - L * 0.6, 4, L * 1.2);
    flash.setAngle(Phaser.Math.Between(-30, 30));
    this.tweens.add({ targets: flash, alpha: 0, duration: 120, onComplete: () => flash.destroy() });
    // 원형 충격파
    const ring = this.add.circle(x, y, 6).setStrokeStyle(3, big ? C.neonPink : C.neonCyan).setDepth(16);
    this.tweens.add({ targets: ring, radius: big ? 42 : 26, alpha: 0, duration: 200, onComplete: () => ring.destroy() });
    this.burst(x, y, big ? 16 : 8, C.neonCyan);
  }

  popText(x, y, text, color, size) {
    const t = this.add.text(x, y, text, {
      fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: size + 'px', fontStyle: 'bold',
      color, stroke: '#ff4fd8', strokeThickness: 4,
    }).setOrigin(0.5).setDepth(30);
    this.tweens.add({ targets: t, y: y - 42, alpha: 0, duration: 650, ease: 'Cubic.Out', onComplete: () => t.destroy() });
  }

  burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const p = this.add.image(x, y, 'pixel').setTint(Phaser.Math.RND.pick([color, GH.COLORS.neonPink, GH.COLORS.neonYellow])).setDepth(15);
      const ang = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const dist = Phaser.Math.Between(20, 80);
      p.setScale(Phaser.Math.FloatBetween(1, 2));
      this.tweens.add({
        targets: p, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist,
        alpha: 0, scale: 0.2, duration: Phaser.Math.Between(250, 550), onComplete: () => p.destroy(),
      });
    }
  }

  banner(title, sub, hold) {
    if (this.bannerGroup) this.bannerGroup.forEach((o) => o.destroy());
    const cx = GH.CONFIG.screen.width / 2;
    const bg = this.add.rectangle(cx, 230, 960, 110, 0x000000, 0.55).setScrollFactor(0).setDepth(200);
    const t1 = this.add.text(cx, 212, title, {
      fontFamily: 'Pretendard, sans-serif', fontSize: '40px', fontStyle: 'bold', color: '#35f2ff',
      stroke: '#ff4fd8', strokeThickness: 6,
    }).setOrigin(0.5).setScrollFactor(0).setDepth(201);
    const t2 = this.add.text(cx, 256, sub, {
      fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '16px', color: '#ffffff',
    }).setOrigin(0.5).setScrollFactor(0).setDepth(201);
    this.bannerGroup = [bg, t1, t2];
    t1.setScale(1.4); this.tweens.add({ targets: t1, scale: 1, duration: 250, ease: 'Back.Out' });
    if (hold > 0) {
      this.time.delayedCall(hold, () => {
        this.tweens.add({ targets: [bg, t1, t2], alpha: 0, duration: 300, onComplete: () => [bg, t1, t2].forEach((o) => o.destroy()) });
      });
    }
  }

  toast(msg) {
    const t = this.add.text(480, 490, msg, { fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '14px', color: '#ffffff', backgroundColor: '#000000b0', padding: { x: 10, y: 6 } })
      .setOrigin(0.5).setScrollFactor(0).setDepth(200);
    this.tweens.add({ targets: t, alpha: 0, delay: msg.length > 20 ? 2500 : 700, duration: 300, onComplete: () => t.destroy() });
  }

  // ===== HUD =====
  createHud(name) {
    const font = { fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', color: '#ffffff' };
    this.add.text(20, 16, 'GLITCH HUNTER', { ...font, fontSize: '22px', fontStyle: 'bold', color: '#35f2ff' }).setScrollFactor(0).setDepth(100);
    // 진행 표시: SECTOR 1 > SECTOR 2 > BOSS
    const steps = [['S1', 'SECTOR 1'], ['S2', 'SECTOR 2'], ['BOSS', 'BOSS']];
    let px = 20;
    steps.forEach(([id, label], i) => {
      const cur = this.L && this.L.id === id;
      const t = this.add.text(px, 44, label, { ...font, fontSize: '13px', fontStyle: cur ? 'bold' : 'normal', color: cur ? '#ff4fd8' : '#8a7fb0' })
        .setScrollFactor(0).setDepth(100);
      px += t.width + 6;
      if (i < steps.length - 1) {
        const a = this.add.text(px, 44, '›', { ...font, fontSize: '13px', color: '#8a7fb0' }).setScrollFactor(0).setDepth(100);
        px += a.width + 6;
      }
    });
    this.add.text(940, 16, '← → 이동   ↑/Space 점프   Z 공격   ↑+Z 올려베기   C 사격   ↓ 방패   X 대시   M 소리', { ...font, fontSize: '13px' })
      .setOrigin(1, 0).setScrollFactor(0).setDepth(100).setAlpha(0.8);
    this.add.text(20, 72, 'HP', { ...font, fontSize: '12px' }).setScrollFactor(0).setDepth(100);
    this.add.text(20, 92, 'DASH', { ...font, fontSize: '12px' }).setScrollFactor(0).setDepth(100);
    this.add.text(20, 110, 'GUARD', { ...font, fontSize: '12px' }).setScrollFactor(0).setDepth(100);
    this.add.text(20, 128, 'SHOT', { ...font, fontSize: '12px' }).setScrollFactor(0).setDepth(100);
    this.enemyText = this.add.text(940, 40, '', { ...font, fontSize: '14px', color: '#ffe14f' }).setOrigin(1, 0).setScrollFactor(0).setDepth(100);
    this.comboText = this.add.text(940, 70, '', {
      ...font, fontSize: '28px', fontStyle: 'bold', color: '#ffe14f', stroke: '#ff4fd8', strokeThickness: 5,
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(100).setAlpha(0);
    this.hud = this.add.graphics().setScrollFactor(0).setDepth(100);
  }

  updateHud(time) {
    const p = this.player;
    const g = this.hud;
    g.clear();
    g.fillStyle(0x000000, 0.5).fillRect(72, 74, 160, 10);
    g.fillStyle(p.hp > 30 ? GH.COLORS.neonCyan : GH.COLORS.danger, 1).fillRect(72, 74, 160 * (p.hp / p.cfg.maxHp), 10);
    const r = p.dashCooldownRatio(time);
    g.fillStyle(0x000000, 0.5).fillRect(72, 94, 80, 8);
    g.fillStyle(r >= 1 ? GH.COLORS.neonYellow : GH.COLORS.neonPurple, 1).fillRect(72, 94, 80 * r, 8);
    const gc = p.cfg.guard;
    const locked = time < p.guardLockedUntil;
    g.fillStyle(0x000000, 0.5).fillRect(72, 112, 80, 8);
    g.fillStyle(locked ? GH.COLORS.danger : GH.COLORS.neonCyan, locked ? 0.5 : 1).fillRect(72, 112, 80 * (p.guardGauge / gc.max), 8);
    for (let i = 0; i < p.cfg.shot.maxAmmo; i++) {
      g.fillStyle(i < p.ammo ? GH.COLORS.neonCyan : 0x333355, 1).fillRoundedRect(72 + i * 22, 129, 16, 8, 3);
    }
    this.enemyText.setText(`남은 버그 ${this.totalEnemies - this.kills} / ${this.totalEnemies}`);
  }
};

// ===== src/scenes/BossScene.js =====
// BOSS SECTOR: 폭주 AI "CORE.EXE"와의 결전 (한 화면 아레나)
window.GH = window.GH || {};

GH.BossScene = class BossScene extends GH.SectorScene {
  constructor() { super('Boss'); }

  levelConfig() {
    return {
      width: GH.CONFIG.screen.width,
      id: 'BOSS', name: 'BOSS SECTOR', title: 'WARNING',
      // 두 그룹 모두 같은 문구 (A/B 테스트에서 화면 차이가 생기지 않도록)
      sub: '폭주 AI "CORE.EXE"가 당신의 전투 데이터를 분석했다',
      platforms: [[150, 340], [810, 340]],   // 내려찍기를 피할 수 있는 양쪽 발판
      playerX: 140, gate: false,
    };
  }

  spawnEnemies(groundY) {
    this.boss = new GH.Boss(this, GH.CONFIG.screen.width - 220, groundY - 55);
    this.enemies.push(this.boss);
  }

  create() {
    super.create();
    this.physics.world.setBoundsCollision(true, true, false, true);  // 보스가 화면 위로 뛰어오를 수 있게
    this.cameras.main.stopFollow();
    this.cameras.main.fadeIn(400);
    this.overloadResults = [];

    const font = { fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', color: '#ffffff' };
    this.bossName = this.add.text(480, 474 + 30, 'CORE.EXE', { ...font, fontSize: '14px', fontStyle: 'bold', color: '#ff4fd8' })
      .setOrigin(0.5).setScrollFactor(0).setDepth(100);
    this.bossBar = this.add.graphics().setScrollFactor(0).setDepth(100);
    this.calloutText = this.add.text(480, 150, '', {
      ...font, fontSize: '26px', fontStyle: 'bold', color: '#ffe14f', stroke: '#ff3b6b', strokeThickness: 6,
    }).setOrigin(0.5).setScrollFactor(0).setDepth(150).setAlpha(0);
  }

  // 보스가 다음 패턴을 외침 (예고의 일부)
  bossCallout(text) {
    this.calloutText.setText(text).setAlpha(1).setScale(1.4);
    this.tweens.killTweensOf(this.calloutText);
    this.tweens.add({ targets: this.calloutText, scale: 1, duration: 180, ease: 'Back.Out' });
    this.tweens.add({ targets: this.calloutText, alpha: 0, delay: 700, duration: 250 });
  }

  onOverloadResult(success, leftRatio) {
    this.overloadResults.push(success);
    GH.Run.overloadResult(success, leftRatio);
  }

  onEnemyKilled(e) {
    this.kills += 1;
    if (this.boss.tele) this.boss.tele.destroy();
    if (this.boss.sweepLabel) this.boss.sweepLabel.destroy();
    this.boss.clearMirror();
    this.cleared = true;
    GH.Run.endAttempt('clear', { hp_left: this.player.hp });
    // 보스 처치 연출: 슬로모션 + 연쇄 폭발
    this.physics.world.timeScale = 3;
    for (let i = 0; i < 8; i++) {
      this.time.delayedCall(i * 120, () => {
        this.burst(e.deathX + Phaser.Math.Between(-60, 60), e.deathY + Phaser.Math.Between(-50, 50), 20, Phaser.Math.RND.pick([GH.COLORS.neonPink, GH.COLORS.neonCyan, GH.COLORS.neonYellow]));
        this.cameras.main.shake(120, 0.012);
        GH.Sfx.kill();
      });
    }
    this.time.delayedCall(1200, () => {
      this.physics.world.timeScale = 1;
      GH.Sfx.clear();
      const ov = this.overloadResults.map((r) => (r ? 'O' : 'X')).join('');
      const sum = GH.Run.completeRun(ov);
      this.victory = true;
      this.showResults(sum);
    });
  }

  // ===== 엔딩 결과 화면 =====
  showResults(sum) {
    const D = 300;
    const font = { fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', color: '#ffffff' };
    const add = (o) => o.setScrollFactor(0).setDepth(D);
    add(this.add.rectangle(480, 270, 960, 540, 0x0a0618, 0.82));
    const panel = add(this.add.rectangle(480, 275, 560, 380, 0x1a0f38, 0.95).setStrokeStyle(3, GH.COLORS.neonCyan));
    const title = add(this.add.text(480, 120, 'SYSTEM RESTORED', { ...font, fontSize: '36px', fontStyle: 'bold', color: '#35f2ff', stroke: '#ff4fd8', strokeThickness: 6 }).setOrigin(0.5));
    add(this.add.text(480, 160, 'CORE.EXE 정화 완료! 네온 도시에 평화가 돌아왔다', { ...font, fontSize: '15px' }).setOrigin(0.5));

    const mm = Math.floor(sum.total_s / 60), ss = String(sum.total_s % 60).padStart(2, '0');
    const ovText = sum.overload ? sum.overload.split('').map((c) => (c === 'O' ? '성공' : '실패')).join(', ') : '없음';
    const rows = [
      ['플레이 시간', `${mm}:${ss}`],
      ['쓰러진 횟수', `${sum.deaths}회`],
      ['받은 피해', `${sum.damage}`],
      ['무력화', ovText],
    ];
    rows.forEach(([k, v], i) => {
      const y = 205 + i * 34;
      const t1 = add(this.add.text(270, y, k, { ...font, fontSize: '17px', color: '#b9a8e8' }).setAlpha(0));
      const t2 = add(this.add.text(560, y, v, { ...font, fontSize: '19px', fontStyle: 'bold' }).setOrigin(1, 0).setAlpha(0));
      this.tweens.add({ targets: [t1, t2], alpha: 1, delay: 300 + i * 200, duration: 200 });
      this.time.delayedCall(300 + i * 200, () => GH.Sfx.jump());
    });

    // 랭크
    const colors = { S: '#ffe14f', A: '#35f2ff', B: '#ff4fd8', C: '#b9a8e8' };
    add(this.add.text(680, 205, 'RANK', { ...font, fontSize: '16px', color: '#b9a8e8' }).setOrigin(0.5));
    const rank = add(this.add.text(680, 270, sum.rank, {
      ...font, fontSize: '96px', fontStyle: 'bold', color: colors[sum.rank], stroke: '#000000', strokeThickness: 8,
    }).setOrigin(0.5).setAlpha(0).setScale(3));
    this.time.delayedCall(1300, () => {
      this.tweens.add({ targets: rank, alpha: 1, scale: 1, duration: 350, ease: 'Back.Out' });
      this.cameras.main.shake(150, 0.01);
      GH.Sfx.rank();
    });
    const hint = { S: '완벽한 사냥!', A: '훌륭한 헌터!', B: '다음엔 덜 맞아 보자', C: '패턴을 읽으면 더 높이!' }[sum.rank];
    const h = add(this.add.text(680, 335, hint, { ...font, fontSize: '13px', color: colors[sum.rank] }).setOrigin(0.5).setAlpha(0));
    this.tweens.add({ targets: h, alpha: 1, delay: 1600, duration: 300 });

    const again = add(this.add.text(480, 420, 'R 키: 처음부터 다시 도전', { ...font, fontSize: '18px', fontStyle: 'bold', color: '#ffe14f' }).setOrigin(0.5));
    this.tweens.add({ targets: again, alpha: 0.4, duration: 600, yoyo: true, repeat: -1 });
    title.setScale(1.3);
    this.tweens.add({ targets: title, scale: 1, duration: 300, ease: 'Back.Out' });
  }

  updateHud(time) {
    super.updateHud(time);
    this.enemyText.setText('');
    const b = this.boss;
    const g = this.bossBar;
    g.clear();
    // 보스 HP 바 (화면 아래)
    const w = 600, x = 480 - w / 2, y = 518;
    g.fillStyle(0x000000, 0.6).fillRect(x - 2, y - 2, w + 4, 14);
    g.fillStyle(b.phase === 2 ? GH.COLORS.danger : GH.COLORS.neonPink, 1).fillRect(x, y, w * (Math.max(0, b.hp) / b.maxHp), 10);
    // 무력화 표시 지점
    GH.CONFIG.boss.overload.triggers.forEach((r) => {
      g.fillStyle(GH.COLORS.neonYellow, 1).fillRect(x + w * r - 1, y - 4, 2, 18);
    });
    // 무력화 게이지 + 남은 시간
    if (b.alive && b.state === 'overload') {
      const o = GH.CONFIG.boss.overload;
      const left = Math.max(0, b.stateUntil - time) / o.time;
      g.fillStyle(0x000000, 0.7).fillRect(330, 98, 300, 16);
      g.fillStyle(GH.COLORS.neonYellow, 1).fillRect(330, 98, 300 * (b.ovGauge / (b.ovGaugeMax || o.gauge)), 16);
      g.fillStyle(GH.COLORS.danger, 1).fillRect(330, 118, 300 * left, 5);
      if (!this.ovLabel) {
        this.ovLabel = this.add.text(480, 84, '무력화 게이지', { fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '13px', color: '#ffe14f' })
          .setOrigin(0.5).setScrollFactor(0).setDepth(100);
      }
      this.ovLabel.setVisible(true);
      // 안내: 떠 있는 보스를 공격하는 방법
      if (!this.ovHint) {
        this.ovHint = this.add.text(480, 136, '점프 공격이나 ↑+Z 올려베기로 코어를 노려라!', {
          fontFamily: 'Pretendard, "Noto Sans KR", sans-serif', fontSize: '15px', fontStyle: 'bold',
          color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 8, y: 4 },
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(100);
      }
      this.ovHint.setVisible(true).setAlpha(Math.floor(time / 400) % 2 ? 1 : 0.6);
    } else {
      if (this.ovLabel) this.ovLabel.setVisible(false);
      if (this.ovHint) this.ovHint.setVisible(false);
    }
  }
};

window.addEventListener('load', () => {
  const S = GH.CONFIG.screen;
  window.game = new Phaser.Game({

    parent: 'game',
    width: S.width,
    height: S.height,
    backgroundColor: '#120a2a',
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: GH.CONFIG.gravity }, debug: false },
    },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [GH.SectorScene, GH.Sector2Scene, GH.BossScene],
  });
});

  </script>
